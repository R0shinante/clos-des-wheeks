/* ==== 13 · coins : esprits des objets, ambiances, confort du refuge, coin préféré de chaque cochon ==== */
const Coin = {
  dirty: true, _list: [], _cnt: {}, amT: 0,

  // les coins du refuge pour une liste d'objets posés : composantes d'un même esprit, proches, avec au moins deux objets différents
  coinsOf(list) {
    const out = [];
    for (const m of MOODS) {
      const it = list.filter(d => DECO[d.id] && DECO[d.id].mood === m); if (it.length < 2) continue;
      const comp = it.map((_, i) => i), find = i => { while (comp[i] !== i) { comp[i] = comp[comp[i]]; i = comp[i]; } return i; };
      for (let i = 0; i < it.length; i++) for (let j = i + 1; j < it.length; j++) if (Math.hypot(it[i].x - it[j].x, (it[i].y - it[j].y) * 1.4) <= COIN_R) comp[find(i)] = find(j);
      const groups = {}; it.forEach((d, i) => { (groups[find(i)] = groups[find(i)] || []).push(d); });
      let best = null;
      for (const g of Object.values(groups)) {
        const kinds = new Set(g.map(d => d.id)).size; if (kinds < 2) continue;
        if (!best || kinds > best.n || (kinds === best.n && g.length > best.items.length)) best = { mood: m, items: g, n: kinds };
      }
      if (best) { best.cx = Math.round(best.items.reduce((s, d) => s + d.x, 0) / best.items.length); best.cy = Math.round(best.items.reduce((s, d) => s + d.y, 0) / best.items.length); out.push(best); }
    }
    return out;
  },
  refresh() {
    const st = GAME.state; if (!st) return;
    this._list = this.coinsOf(st.deco); this._cnt = {};
    for (const d of st.deco) { const m = DECO[d.id] && DECO[d.id].mood; if (m) this._cnt[m] = (this._cnt[m] | 0) + 1; }
    this.dirty = false;
  },
  list() { if (this.dirty) this.refresh(); return this._list; },
  count(mood) { if (this.dirty) this.refresh(); return this._cnt[mood] | 0; },
  level() { return this.list().length; },

  // l'esprit que ce cochon préfère : surtout selon son caractère, parfois autrement (un cochon, une personnalité)
  pref(pig) {
    const h = hash32(pig.id + ':coin'), base = MOOD_OF_CHAR[phenotype(pig).caractere] || 'nature';
    return (h % 100) < 62 ? base : MOODS[(h >>> 8) % MOODS.length];
  },
  // aperçu pendant la pose : l'objet qu'on déplace rejoint-il un coin ?
  preview(k, x, y, idx) {
    const st = GAME.state, rest = st.deco.filter((_, i) => i !== idx), me = { id: k, x: x, y: y };
    const c = this.coinsOf(rest.concat([me])).find(z => z.items.indexOf(me) >= 0);
    return c ? c.mood : null;
  },
  // places où un cochon peut se tenir près des objets d'un esprit
  spots(mood) {
    const st = GAME.state, W = GAME.world, out = [];
    for (const d of st.deco) {
      const D = DECO[d.id]; if (D.mood !== mood) continue;
      const hw = D.fw / 2 + 9, c = D.block ? [[-hw, 3, 1], [hw, 3, -1], [0, 9, 0]] : [[0, -4, 0]];
      for (const o of c) {
        const x = clamp(d.x + o[0], 30, 146), y = clamp(d.y + o[1], 84, 268);
        if (!navBlockedAt(W.nav, x, y)) out.push({ x: x, y: y, face: o[2] || (x < d.x ? 1 : -1), what: 'coin', deco: d });
      }
    }
    return out;
  },
  // un objet vient d'être posé ou rangé : y a-t-il un nouveau coin ? (cadeau unique par esprit)
  after() {
    const st = GAME.state; this.dirty = true; st.amb = st.amb || {};
    const fresh = this.list().filter(c => !st.amb[c.mood]); if (!fresh.length) return;
    const c = fresh[0]; st.amb[c.mood] = st.day; Save.dirty();
    Care.gain(COIN_CLOVERS, c.cx, c.cy - 18, 'clover'); AUD.chime(); AUD.note(14, 0.4, 0.14, 0);
    for (const d of c.items) for (let i = 0; i < 3; i++) FX.spark(d.x + (i - 1) * 4, d.y - DECO[d.id].fh);
    if (!st.hints.ambiance) UI.hintOnce('ambiance'); else UI.toast(MOOD[c.mood].coin + ' formé !', 'Les cochons vont s’y plaire. +' + COIN_CLOVERS + ' trèfles.', 'coin');
  },
  // chaque aube : le confort rapporte quelques cœurs, et on le dit quand il change
  daily() {
    const st = GAME.state, lv = this.level(); if (!st) return;
    if (lv > 0) { const c = this.list()[0]; Care.gain(lv, c.cx, c.cy - 18); }
    if (lv !== (st.cfl | 0)) {
      if (lv > (st.cfl | 0)) UI.toast('Refuge plus confortable', lv + (lv > 1 ? ' coins aménagés' : ' coin aménagé') + ' : +' + lv + (lv > 1 ? ' cœurs' : ' cœur') + ' chaque matin.', 'coin');
      st.cfl = lv; Save.dirty();
    }
  },
  // un cochon a passé du temps dans son coin préféré
  visited(e, env) {
    if (!env.playing) return; const pig = e.pig;
    pig.fv = Math.min(99, (pig.fv | 0) + 1); Save.dirty();
    if (!pig.fk && pig.fv >= COIN_VISITS) {
      pig.fk = true; Season.bump('manie');
      UI.toast('Coin préféré trouvé !', pig.name + ' aime se poser au ' + MOOD[this.pref(pig)].coin.toLowerCase() + '.', 'info');
      AUD.chime(); for (let i = 0; i < 4; i++) FX.spark(e.x + (i - 1.5) * 4, e.y - 12);
      UI.hintOnce('coin');
    }
  },
  // la fiche : ce qu'on sait du coin préféré
  cardLine(pig, preview) {
    if (pig.fk && !preview) return { t: 'Coin préféré : ' + MOOD[this.pref(pig)].name.toLowerCase(), c: 14 };
    const lien = BOND_STEPS.filter(s => (pig.bond | 0) >= s).length;
    if (!preview && lien >= 3) return { t: 'Coin préféré : ' + MOOD[this.pref(pig)].name.toLowerCase() + ' ?', c: 14 };
    return { t: 'Coin préféré : ? à découvrir', c: 3 };
  },
  // de petites étincelles au-dessus des coins formés : on voit que le coin « vit »
  update(dt) {
    this.amT -= dt; if (this.amT > 0 || !GAME.playing || !GAME.state) return;
    this.amT = 2.4 + Math.random() * 1.8;
    const l = this.list(); if (!l.length) return;
    const c = l[(Math.random() * l.length) | 0], d = c.items[(Math.random() * c.items.length) | 0];
    FX.spark(d.x + (Math.random() - 0.5) * 12, d.y - DECO[d.id].fh - 2 - Math.random() * 6);
  }
};

/* ---- 13_life.js ---- */
/* ==== 13 · vie du refuge : âges, Chambre douillette, naissances, adoptions, carnet, cartes postales ====
   Rien ici ne punit : personne ne tombe malade, personne ne disparaît, aucune échéance. Un refuge plein se contente de demander
   qu'on confie quelques cochons à des familles avant de former un nouveau couple. */
const Life = {
  news: [], changed: false,

  // ---------- état ----------
  cap(st) { return CAP_BY_LV[clamp(st.repLv | 0, 0, CAP_BY_LV.length - 1)]; },
  count(st) { return st.pigs.filter(p => p.age !== 'senior').length + (st.nursery ? 2 : 0); }, // les sages ont leur jardin : ils ne comptent pas
  room(st) { return this.cap(st) - this.count(st); },
  unlocked(st) { return (st.repLv | 0) >= NURSERY_LV; },
  adults(st) { return st.pigs.filter(p => p.age === 'adulte'); },
  seniors(st) { return st.pigs.filter(p => p.age === 'senior'); },
  total(st) { return st.pigs.length + (st.nursery ? 2 : 0); },
  nameless(st) { return st.pigs.filter(p => p.nn); },
  left(st) { return st.nursery ? Math.max(0, NURSERY_DAYS - (st.day - st.nursery.since)) : 0; },
  unread(st) { return (st.cards || []).filter(c => !c.r).length; },
  attention(st) { return this.nameless(st).length + this.unread(st) + ((st.reqs || []).length ? 1 : 0); }, // petit point sur le menu
  usedNames(st) { return st.pigs.concat(st.nursery ? st.nursery.pigs : []).map(p => p.name); },

  canPair(st) {
    if (!this.unlocked(st)) return { ok: false, why: 'La chambre ouvre quand le Clos devient « ' + REP[NURSERY_LV].name.replace('Clos ', '') + ' ».' };
    if (st.nursery) return { ok: false, why: 'La chambre est déjà occupée.' };
    if (this.nameless(st).length) return { ok: false, why: 'Donnez d’abord un nom aux petits.' };
    if (this.adults(st).length < 2) return { ok: false, why: 'Il faut deux cochons adultes.' };
    if (this.room(st) < 0) return { ok: false, why: 'Le refuge est complet : confiez quelques cochons à des familles.' };
    return { ok: true, why: '' };
  },

  // ---------- âges ----------
  refreshAges(st, news) {
    for (const p of st.pigs.concat(st.nursery ? st.nursery.pigs : [])) {
      const a = ageForDays(st.day - p.born);
      if (a !== p.age) { if (news) news.push({ k: 'age', pig: p.name, from: p.age, to: a }); p.age = a; }
    }
  },

  // ---------- carnet de pelages ----------
  discover(st, pig, news) { // un cochon rencontré : sa page du carnet se remplit (vrai si c'est une nouvelle page)
    st.book = st.book || {};
    const key = pelageKey(pig), poil = phenotype(pig).poil; let r = st.book[key], fresh = false;
    if (!r) { r = st.book[key] = { n: pig.name, k: 0, p: [], d: st.day }; fresh = true; }
    if (!pig.bk) { pig.bk = true; r.k++; }
    if (r.p.indexOf(poil) < 0) r.p.push(poil);
    if (fresh && news) news.push({ k: 'page', key: key, pig: pig.name });
    Rare.note(st, pig, news);
    return fresh;
  },
  pages(st) { return Object.keys(st.book || {}).length; },
  sync(st) { // à chaque (re)construction : tout cochon présent est au carnet (sans fanfare pour ce qui existait déjà)
    for (const p of st.pigs.concat(st.nursery ? st.nursery.pigs : [])) this.discover(st, p, null);
  },

  // ---------- Chambre douillette ----------
  pair(st, A, B) {
    const adv = vetAdvice(A, B);
    for (const p of [A, B]) { const i = st.pigs.indexOf(p); if (i >= 0) st.pigs.splice(i, 1); GAME.dropEnt(p.id); }
    st.nursery = { pigs: [A, B], since: st.day, small: !!adv.small };
    Save.dirty(); Save.flush();
  },
  recall(st) { // on peut toujours les rappeler, sans rien perdre
    const nu = st.nursery; if (!nu) return;
    st.nursery = null;
    for (const p of nu.pigs) { st.pigs.push(p); GAME.addEnt(p); }
    Save.dirty(); Save.flush();
  },
  birth(st, news) {
    const nu = st.nursery, A = nu.pigs[0], B = nu.pigs[1], rng = mulberry32(hash32(st.seed + ':birth:' + st.day + A.id + B.id) >>> 0);
    let n = +wpick(rng, LITTER_W); if (nu.small) n = Math.min(n, 1 + (rng() < 0.5 ? 1 : 0));
    st.pigs.push(A, B); st.nursery = null;
    const used = this.usedNames(st), pups = [];
    for (let i = 0; i < n; i++) { const p = crossPig(rng, A, B, st.day, used); Rare.rollBirth(st, p, i); used.push(p.name); pups.push(p); }
    const rev = revealCarriers([A, B], pups);
    pups.forEach(p => { st.pigs.push(p); this.discover(st, p, news); });
    news.push({ k: 'birth', n: n, A: A.name, B: B.name, rev: rev });
    this.changed = true;
  },

  // ---------- nouveaux arrivants ----------
  maybeArrival(st, news) { // un cochon frappe à la porte : de nouveaux gènes, une nouvelle rencontre (jamais si le refuge est plein)
    if (st.day < ARR_FIRST || this.room(st) < 1 || news.some(n => n.k === 'birth')) return;
    const rng = mulberry32(hash32(st.seed + ':arr:' + st.day) >>> 0);
    if (st.arrLast && (st.day - st.arrLast < ARR_GAP || rng() > ARR_P)) return;
    const used = this.usedNames(st); let pig = null;
    for (let i = 0; i < 6; i++) { // on préfère un pelage encore absent du carnet, sans l'imposer
      const c = makePig(rng, {}, used); pig = c;
      if (!(st.book && st.book[pelageKey(c)])) break;
    }
    pig.born = st.day - 5 - Math.floor(rng() * 15); pig.age = ageForDays(st.day - pig.born);
    Rare.rollLegend(st, pig);
    st.pigs.push(pig); st.arrLast = st.day; this.changed = true;
    this.discover(st, pig, news);
    news.push({ k: 'arrival', id: pig.id, tx: Math.floor(rng() * ARR_TEXT.length) });
  },

  // ---------- adoptions ----------
  groupOf(car) { for (const k of CAR_GROUP_KEYS) if (CAR_GROUPS[k].keys.indexOf(car) >= 0) return k; return 'calme'; },
  reqMatch(pig, req) {
    if (pig.age !== 'jeune' && pig.age !== 'adulte') return false;
    if (req.small && pig.age !== 'jeune') return false;
    const ph = phenotype(pig);
    if (req.col && ph.couleur !== req.col) return false;
    if (req.mot && ph.motif !== req.mot) return false;
    if (req.poil && ph.poil !== req.poil) return false;
    if (req.car && CAR_GROUPS[req.car].keys.indexOf(ph.caractere) < 0) return false;
    return true;
  },
  reqDesc(req) {
    let s = req.small ? 'un petit cochon' : 'un cochon';
    if (req.col) s += ' ' + GENES.couleur.label[req.col];
    if (req.mot) s += ' ' + GENES.motif.label[req.mot];
    if (req.poil) s += ', ' + ({ court: 'à poil court', abyssin: 'à poil abyssin', peruvien: 'à poil péruvien', teddy: 'à poil teddy', skinny: 'de style skinny', crete: 'à crête' })[req.poil];
    if (req.car) s += ', ' + CAR_GROUPS[req.car].word;
    return s;
  },
  makeReq(st, rng) {
    const pool = st.pigs.concat(st.nursery ? st.nursery.pigs : []).filter(p => p.age !== 'senior' && p.age !== 'bebe');
    const src = pool.length ? pick(rng, pool) : null, easy = !!src && rng() < 0.4;
    const req = { id: 'r' + st.day + Math.floor(rng() * 90 + 10), fam: pick(rng, FAMS), col: null, mot: null, poil: null, car: null, small: rng() < 0.2, d: st.day };
    const map = { col: 'couleur', mot: 'motif', poil: 'poil' };
    for (const c of shuffle(rng, ['col', 'mot', 'poil', 'car']).slice(0, rng() < 0.55 ? 1 : 2)) {
      if (c === 'car') req.car = easy ? this.groupOf(phenotype(src).caractere) : pick(rng, CAR_GROUP_KEYS);
      else {
        const g = map[c];
        req[c] = easy ? phenotype(src)[g] : (src && rng() < 0.7 ? pick(rng, src.genes[g]) : wpick(rng, GENES[g].w)); // souvent un gène qu'un de vos cochons porte, même caché
      }
    }
    return req;
  },
  maybeRequest(st, news) {
    if (!this.unlocked(st) || st.reqs.length >= MAX_REQ || st.day - (st.reqLast | 0) < REQ_GAP) return;
    const rng = mulberry32(hash32(st.seed + ':req:' + st.day) >>> 0);
    if (rng() > 0.8) return;
    const req = this.makeReq(st, rng);
    st.reqs.push(req); st.reqLast = st.day; news.push({ k: 'req', fam: req.fam });
  },
  canAdopt(st, pig) {
    if (pig.nn) return { ok: false, why: 'Il faut d’abord lui trouver un nom.' };
    if (pig.age === 'bebe') return { ok: false, why: 'Trop petit pour partir : il faut attendre quelques jours.' };
    if (pig.age === 'senior' && this.seniors(st).length <= SENIOR_CAP) return { ok: false, why: 'Il passe sa retraite au refuge, au Jardin des Anciens (' + SENIOR_CAP + ' places).' };
    if (this.total(st) < 3) return { ok: false, why: 'Le refuge garde toujours au moins deux cochons.' };
    return { ok: true, why: '' };
  },
  famFor(st, pig, req) { return req ? req.fam : pick(mulberry32(hash32(st.seed + ':fam:' + pig.id) >>> 0), FAMS); },
  adopt(st, pig, req) {
    const i = st.pigs.indexOf(pig); if (i < 0 || !this.canAdopt(st, pig).ok) return false;
    const fam = this.famFor(st, pig, req);
    st.pigs.splice(i, 1); GAME.dropEnt(pig.id);
    st.gone.push({ n: pig.name, s: pig.seed, k: phenoKeys(pig), fam: fam, due: st.day + 3, c: 0 });
    if (st.gone.length > 12) st.gone.shift();
    st.adopted = (st.adopted | 0) + 1;
    if (req) st.reqs = st.reqs.filter(r => r !== req);
    const rw = req ? ADOPT_REWARD.req : ADOPT_REWARD.free;
    if (rw.h) Care.gain(rw.h, 88, 120);
    if (rw.c) Care.gain(rw.c, 88, 128, 'clover');
    Save.dirty(); Save.flush(); return true;
  },
  dismiss(st, req) { st.reqs = st.reqs.filter(r => r !== req); st.reqLast = Math.max(st.reqLast | 0, st.day - 1); Save.dirty(); },
  deliverCards(st, news) {
    for (const g of st.gone.slice()) {
      if (g.due > st.day) continue;
      const rng = mulberry32(hash32(g.n + ':' + g.s + ':' + g.c + ':' + st.seed) >>> 0);
      st.cards.push({ n: g.n, s: g.s, k: g.k, fam: g.fam, sc: Math.floor(rng() * CARD_SCENES.length), x: Math.floor(rng() * 5), kd: g.c, d: st.day, r: false });
      if (st.cards.length > 30) st.cards.shift();
      news.push({ k: 'card', n: g.n });
      g.c++;
      if (g.c >= 2) st.gone.splice(st.gone.indexOf(g), 1); else g.due = st.day + 6 + Math.floor(rng() * 4);
    }
  },
  cardText(c) { return CARD_TEXT[c.kd][c.x % CARD_TEXT[c.kd].length].replace(/\{n\}/g, c.n).replace(/\{f\}/g, 'la famille ' + c.fam); },

  // ---------- le jour qui commence (appelé pendant le fondu, avant la tournée de soins) ----------
  dayStart(st) {
    const news = []; this.changed = false;
    Season.dayStart(st, news);
    this.refreshAges(st, news);
    if (st.nursery && st.day - st.nursery.since >= NURSERY_DAYS) this.birth(st, news);
    this.deliverCards(st, news);
    this.maybeRequest(st, news);
    this.maybeArrival(st, news);
    this.news = news; Save.dirty();
    return news;
  },
  // ... et ce qu'on en raconte une fois le fondu terminé
  afterFade() {
    const st = GAME.state, news = this.news; this.news = []; if (!st) return;
    const ages = news.filter(n => n.k === 'age');
    if (ages.length) {
      const a = ages[0], more = ages.length > 1 ? (ages.length === 2 ? ' Un autre cochon a grandi aussi.' : ' ' + (ages.length - 1) + ' autres cochons ont grandi aussi.') : '';
      const msg = a.to === 'senior' ? a.pig + ' entre au Jardin des Anciens : son portrait y est accroché.' : a.pig + (a.to === 'jeune' ? ' grandit : ce n’est plus un bébé.' : ' a bien grandi : c’est un adulte maintenant.');
      UI.toast('Ça grandit !', msg + more, 'age');
      if (ages.some(n => n.to === 'senior')) UI.hintOnce('sages');
    }
    if (news.some(n => n.k === 'season')) { const k = news.find(n => n.k === 'season').key; UI.toast(SEASON_INFO[k].name + ' commence', SEASON_INFO[k].intro, 'season'); UI.hintOnce('saison'); }
    if (news.some(n => n.k === 'req')) { const f = news.find(n => n.k === 'req').fam; UI.toast('Du courrier d’adoption', 'La famille ' + f + ' a écrit. Voir : menu, « Adoptions ».', 'adopt'); UI.hintOnce('adoption'); }
    if (news.some(n => n.k === 'card')) { AUD.note(9, 0.5, 0, 0); AUD.note(14, 0.5, 0.12, 0); } if (news.some(n => n.k === 'card')) UI.toast('Une carte postale !', 'Une carte ' + elideDe(news.find(n => n.k === 'card').n) + ' est rangée dans le carnet.', 'card');
    Coin.daily();
    if (this.nameless(st).length) Nurs.openBirth(news);
    else if (news.some(n => n.k === 'arrival')) Arrive.open(news);
  }
};

/* ---- 13_mail.js ---- */
/* ==== 13 · courrier : une boîte aux lettres sur la clôture, un petit mot par jour, un petit cadeau ====
   (les lettres d'adoption de l'étape 4 arriveront par la même boîte) */
const MAILBOX = { x: 161, y: 202 };
const Mail = {
  sync(st) { // une lettre par journée, choisie de façon stable (la recharger ne la change pas)
    const m = st.mail;
    if (m && m.day === st.day) return;
    const hist = m && m.hist ? m.hist.slice() : [], np = st.pigs.length;
    let pool = MAIL.filter(l => (!l.day1 || st.day === 1) && (!l.min || st.day >= l.min) && (!l.pigs || np >= l.pigs) && hist.indexOf(l.id) < 0);
    if (!pool.length) pool = MAIL.filter(l => !l.day1);
    const first = st.day === 1 && !hist.length && MAIL[0];
    const pickL = first || pool[hash32(st.seed + ':mail:' + st.day) % pool.length];
    st.mail = { day: st.day, id: pickL.id, took: false, hist: hist.concat(pickL.id).slice(-8) };
    Save.dirty();
  },
  cur() { const st = GAME.state; return st.mail ? MAIL.find(l => l.id === st.mail.id) : null; },
  taken() { return !GAME.state.mail || GAME.state.mail.took; },
  // les noms des cochons dans le texte : stables pour la journée
  text(l) {
    const st = GAME.state, r = mulberry32(hash32(st.seed + ':n:' + st.day)), all = st.pigs.length ? st.pigs : (st.nursery ? st.nursery.pigs : [{ name: 'votre cochon' }]);
    const a = pick(r, all), others = all.filter(p => p !== a), b = others.length ? pick(r, others) : a;
    return l.text.replace(/\{pig2\}/g, b.name).replace(/\{pig\}/g, a.name);
  },
  // cadeau du jour, ajusté si on l'a déjà (une graine déjà connue devient quelques trèfles)
  gift(l) {
    const st = GAME.state, g = l.gift || {};
    if (g.seed && Garden.seeds(st).indexOf(g.seed) >= 0) return { c: 4 };
    if (g.deco && ((st.inv[g.deco] | 0) > 0 || st.deco.some(d => d.id === g.deco))) return { c: 5 };
    return g;
  },
  giftText(g) {
    if (g.c) return g.c + (g.c > 1 ? ' trèfles' : ' trèfle');
    if (g.h) return g.h + (g.h > 1 ? ' cœurs' : ' cœur');
    if (g.seed) return 'des graines : ' + seedName(g.seed).toLowerCase();
    if (g.deco) return 'un objet : ' + DECO[g.deco].name.toLowerCase();
    return 'rien du tout';
  },

  // ---------- gestes ----------
  hit(x, y) { return x >= MAILBOX.x - 10 && x <= MAILBOX.x + 9 && y >= MAILBOX.y - 26 && y <= MAILBOX.y + 2; },
  tap(x, y) {
    if (!this.hit(x, y)) return false;
    if (Care.fade) return true;
    UI.close(); UI.letter = true; AUD.paper(); UI.hintOnce('courrier'); return true;
  },
  take() {
    const st = GAME.state, l = this.cur(); if (!l || st.mail.took) return;
    const g = this.gift(l), px = MAILBOX.x, py = MAILBOX.y - 20;
    st.mail.took = true; UI.letter = false; Save.dirty(); Season.bump('lettre');
    if (g.c) Care.gain(g.c, px, py, 'clover');
    if (g.h) Care.gain(g.h, px, py, 'heart');
    if (g.seed) { st.seedx = st.seedx || []; if (st.seedx.indexOf(g.seed) < 0) st.seedx.push(g.seed); UI.toast('Des graines !', 'Vous pouvez maintenant semer : ' + seedName(g.seed).toLowerCase() + '.', 'mail'); }
    if (g.deco) { st.inv[g.deco] = (st.inv[g.deco] | 0) + 1; UI.toast('Un cadeau !', DECO[g.deco].name + ' vous attend au marché : touchez « Poser ».', 'mail'); }
    for (let i = 0; i < 4; i++) FX.spark(px, py);
    AUD.buy();
  },

  // ---------- dessin ----------
  items() { return [{ y: MAILBOX.y, fn: ctx => this.drawBox(ctx) }]; },
  drawBox(ctx) {
    const st = GAME.state, up = st.mail && !st.mail.took, x = MAILBOX.x, y = MAILBOX.y;
    groundShadow(ctx, GAME.world, x + 1, y, 6, 1.6);
    R(ctx, x - 1, y - 14, 3, 15, 13); R(ctx, x - 1, y - 14, 1, 15, 15); R(ctx, x, y - 14, 1, 15, 14);            // poteau
    R(ctx, x - 7, y - 24, 14, 9, 3); R(ctx, x - 6, y - 25, 12, 1, 3); R(ctx, x - 6, y - 24, 12, 8, 26);           // boîte en fer-blanc
    R(ctx, x - 6, y - 24, 12, 1, 7); R(ctx, x - 6, y - 17, 12, 1, 25); R(ctx, x - 7, y - 16, 14, 1, 3); R(ctx, x - 3, y - 21, 6, 2, 1);
    R(ctx, x - 7, y - 24, 1, 9, 3); P(ctx, x - 5, y - 23, 7);
    if (up) { R(ctx, x + 7, y - 31, 1, 9, 13); R(ctx, x + 8, y - 31, 5, 4, 28); R(ctx, x + 8, y - 31, 5, 1, 24); R(ctx, x + 8, y - 28, 5, 1, 19); } // drapeau relevé
    else { R(ctx, x + 7, y - 21, 6, 1, 13); R(ctx, x + 11, y - 22, 3, 2, 28); }
    if (up && Math.round(Math.sin(G.time * 2.8)) >= 0) { // enveloppe qui flotte
      const ey = y - 40 + Math.round(Math.sin(G.time * 2.8) * 1.2);
      R(ctx, x - 6, ey, 13, 9, 14); R(ctx, x - 5, ey + 1, 11, 7, 7); L(ctx, x - 5, ey + 1, x, ey + 5, 17); L(ctx, x + 5, ey + 1, x, ey + 5, 17); P(ctx, x, ey + 6, 28);
    }
  },
  drawLetter(ctx) {
    const l = this.cur(); if (!l) { UI.letter = false; return; }
    UI.reg('ml-close', 0, 0, G.W, G.H, 'bg'); dimLayer(ctx);
    const st = GAME.state, took = st.mail.took, body = FONT.wrap(this.text(l), 124), g = this.gift(l), gl = took ? ['Cadeau pris, merci !'] : ['Dans l’enveloppe :'].concat(FONT.wrap(this.giftText(g), 124));
    const w = 148, h = 34 + body.length * 11 + 14 + gl.length * 11 + 40, x = (G.W - w) >> 1, y = clamp(Math.round((BAR_Y - h) / 2), HUD_H + 6, 80);
    UI.reg('ml-panel', x, y, w, h); panel(ctx, x, y, w, h);
    ctext(ctx, 'Le courrier du jour', x + (w >> 1), y + 8, 13); R(ctx, x + 22, y + 19, w - 44, 1, 17);
    FONT.draw(ctx, 'De : ' + l.from, x + 12, y + 24, 19, 1);
    body.forEach((s, i) => FONT.draw(ctx, s, x + 12, y + 37 + i * 11, 13, 1));
    const gy = y + 37 + body.length * 11 + 5;
    R(ctx, x + 12, gy, w - 24, 1, 17);
    gl.forEach((t, i) => ctext(ctx, t, x + (w >> 1), gy + 6 + i * 11, took ? 14 : 19));
    UI.btn(ctx, 'ml-' + (took ? 'close' : 'take'), x + (w >> 1) - 32, y + h - 26, 64, 18, took ? 'Fermer' : 'Prendre', 'btn');
  },
  act(h) {
    if (h.id === 'ml-take') this.take();
    else if (h.id === 'ml-close') { UI.letter = false; AUD.back(); }
  }
};

/* ---- 13_market.js ---- */
/* ==== 13 · marché : on y échange des trèfles contre de la déco ; la réputation (cœurs) ouvre de nouveaux étals ==== */
const MAX_EACH = 4; // exemplaires d'un même objet (posés + rangés)
const Market = {
  open() {
    const st = GAME.state;
    if (st.phase !== 1) { UI.toast('Le marché', st.phase === 0 ? 'Il ouvre en journée : les soins du matin d’abord.' : 'Il a fermé pour ce soir. À demain !', 'garden'); AUD.deny(); return; }
    UI.close(); UI.market = { page: 0, msg: '', msgT: 0 }; AUD.pop(); UI.hintOnce('marche');
  },
  update(dt) { const m = UI.market; if (m && m.msgT > 0) m.msgT -= dt; },
  have(k) { const st = GAME.state; return (st.inv[k] | 0) + st.deco.filter(d => d.id === k).length; },
  say(t) { const m = UI.market; if (m) { m.msg = t; m.msgT = 2.4; } },
  geom() {
    const per = 5, rh = 27, pages = Math.ceil(SHOP_KEYS.length / per), page = clamp(UI.market.page, 0, pages - 1), w = 164, h = 52 + per * rh + 24, x = (G.W - w) >> 1, y = clamp(Math.round((BAR_Y - h) / 2) + 2, HUD_H + 3, 40);
    return { x: x, y: y, w: w, h: h, per: per, rh: rh, pages: pages, page: page, keys: SHOP_KEYS.slice(page * per, page * per + per) };
  },
  draw(ctx) {
    const st = GAME.state, g = this.geom(), lv = st.repLv | 0, m = UI.market;
    UI.reg('mk-close', 0, 0, G.W, G.H, 'bg'); dimLayer(ctx);
    UI.reg('mk-panel', g.x, g.y, g.w, g.h); panel(ctx, g.x, g.y, g.w, g.h, { noRivets: true });
    ctext(ctx, 'Le marché', g.x + (g.w >> 1) - 22, g.y + 8, 13);
    const nc = String(st.clover | 0), wc = FONT.width(nc); FONT.draw(ctx, nc, g.x + g.w - 11 - wc, g.y + 8, 13, 1); Care.drawClover(ctx, g.x + g.w - 20 - wc, g.y + 8, false);
    const nxt = REP[Math.min(lv + 1, REP.length - 1)], repTxt = REP[lv].name + (lv < REP.length - 1 ? ' · prochain palier ' + nxt.at + ' cœurs' : '');
    FONT.draw(ctx, FONT.width(repTxt) <= g.w - 20 ? repTxt : REP[lv].name, g.x + 10, g.y + 22, 14, 1);
    R(ctx, g.x + 8, g.y + 33, g.w - 16, 1, 17);
    g.keys.forEach((k, i) => {
      const D = DECO[k], y = g.y + 37 + i * g.rh, x = g.x + 6, w = g.w - 12, locked = D.lv > lv, own = st.inv[k] | 0, pr = UI.isPressed('mk-row', k);
      if (pr) R(ctx, x, y, w, g.rh - 2, 17);
      R(ctx, x, y + 1, 32, 24, 13); R(ctx, x + 1, y + 2, 30, 22, locked ? 3 : 29); // vignette : l'objet à taille réelle
      const s = DSP.get(k, 0, false);
      if (locked) ctx.drawImage(DSP.ghost(k).c, x + 16 - (s.w >> 1), y + 13 - (s.h >> 1)); else ctx.drawImage(s.c, x + 16 - (s.w >> 1), y + 13 - (s.h >> 1));
      FONT.draw(ctx, D.name, x + 37, y + 3, locked ? 3 : 13, 1);
      if (locked) { icon(ctx, 'lock', x + 37, y + 14, 3); FONT.draw(ctx, 'dès ' + REP[D.lv].at + ' cœurs', x + 45, y + 13, 3, 1); }
      else if (own > 0) FONT.draw(ctx, own + (own > 1 ? ' rangés' : ' rangé'), x + 37, y + 13, 19, 1);
      else { Care.drawClover(ctx, x + 37, y + 13, false); FONT.draw(ctx, String(D.price), x + 46, y + 13, (st.clover | 0) >= D.price ? 14 : 19, 1); }
      const bx = x + w - 48, label = own > 0 ? 'Poser' : 'Acheter';
      if (!locked) { const bp = UI.isPressed('mk-buy', k); button(ctx, bx, y + 3, 46, 18, bp, false); ctext(ctx, label, bx + 23, y + 8 + (bp ? 1 : 0), 13); UI.reg('mk-buy', bx, y + 3, 46, 18, k); }
      else UI.reg('mk-lock', x, y, w, g.rh - 2, k);
      if (i < g.keys.length - 1) R(ctx, x + 2, y + g.rh - 1, w - 4, 1, 17);
    });
    const fy = g.y + g.h - 20;
    if (g.pages > 1) {
      UI.btn(ctx, 'mk-prev', g.x + 6, fy, 26, 15, '', 'p'); UI.btn(ctx, 'mk-next', g.x + g.w - 32, fy, 26, 15, '', 'n');
      icon(ctx, 'left', g.x + 17, fy + 4, 13); icon(ctx, 'right', g.x + g.w - 21, fy + 4, 13);
    }
    const msg = m.msgT > 0 ? m.msg : (g.pages > 1 ? 'Page ' + (g.page + 1) + ' sur ' + g.pages : 'Touchez un objet pour l’acheter');
    ctext(ctx, msg, g.x + (g.w >> 1), fy + 4, m.msgT > 0 ? 19 : 14);
  },
  act(h) {
    const st = GAME.state, m = UI.market;
    switch (h.id) {
      case 'mk-close': UI.market = null; AUD.back(); break;
      case 'mk-prev': m.page = Math.max(0, m.page - 1); AUD.pop(); break;
      case 'mk-next': m.page = Math.min(Math.ceil(SHOP_KEYS.length / 5) - 1, m.page + 1); AUD.pop(); break;
      case 'mk-lock': { const D = DECO[h.data]; this.say('Il faut ' + REP[D.lv].at + ' cœurs : « ' + REP[D.lv].name.toLowerCase() + ' ».'); AUD.deny(); break; }
      case 'mk-buy': {
        const k = h.data, D = DECO[k];
        if ((st.inv[k] | 0) > 0) { Deco.startPlace(k, null); break; }
        if (this.have(k) >= MAX_EACH) { this.say('Vous en avez déjà assez !'); AUD.deny(); break; }
        if ((st.clover | 0) < D.price) { this.say('Il manque ' + (D.price - (st.clover | 0)) + ' trèfle' + (D.price - (st.clover | 0) > 1 ? 's' : '') + '.'); AUD.deny(); break; }
        st.clover -= D.price; Care.shownC = Math.min(Care.shownC, st.clover); st.inv[k] = (st.inv[k] | 0) + 1; Save.dirty(); AUD.buy();
        Deco.startPlace(k, null); break;
      }
    }
  }
};

/* ---- 13_nursery.js ---- */
/* ==== 13 · Chambre douillette : choisir un couple, l'avis du vétérinaire, la naissance, le nommage ====
   La chambre, c'est la cabane du refuge : le couple s'y repose deux nuits, puis la portée apparaît au réveil. */

// ---------- petits dessins partagés (carnet, cartes, adoption réutilisent ceux-ci) ----------
function miniPig(ctx, pig, cx, gy, sc, pose, f) { // cochon posé sur la ligne gy, centré sur cx, à l'échelle sc
  const s = pigSprite(pig, pose || 'stand', f || 0);
  ctx.drawImage(s.c, Math.round(cx - s.ax * sc), Math.round(gy - s.gy * sc), s.w * sc, s.h * sc);
}
function fitText(s, w) { while (FONT.width(s) > w && s.length > 3) s = s.slice(0, -2).replace(/[ ,.]+$/, '') + '…'; return s; } // coupe avec une ellipse plutôt que de déborder
function nameClean(s) { // seuls les signes que la police sait dessiner
  return s.replace(/[^A-Za-z0-9 '’\-àâçéèêëîïôùûüÀÂÇÉÈÊËÎÏÔÙÛÜœ]/g, '').replace(/'/g, '’').replace(/\s+/g, ' ').slice(0, 14);
}
function drawNest(ctx, x, y, w, h, pigs, t, o) { // une chambre douillette vue de face : cloison, fenêtre, panier de foin, dormeurs

  for (let i = 3; i < w - 2; i += 12) R(ctx, x + i, y + 1, 1, h - 24, 16);                       // lattes du mur
  R(ctx, x + 1, y + h - 24, w - 2, 3, 15); R(ctx, x + 1, y + h - 24, w - 2, 1, 16);               // plinthe
  R(ctx, x + 1, y + h - 21, w - 2, 20, 14);
  for (let i = 0; i < w; i += 18) R(ctx, x + 1 + i, y + h - 21, 1, 20, 13);                      // lames du sol
  R(ctx, x + w - 36, y + 9, 24, 24, 13); R(ctx, x + w - 35, y + 10, 22, 22, 15);                // fenêtre
  R(ctx, x + w - 34, y + 11, 20, 20, o.night ? 1 : 26); R(ctx, x + w - 25, y + 11, 2, 20, 15); R(ctx, x + w - 34, y + 20, 20, 2, 15);
  if (o.night) { P(ctx, x + w - 31, y + 14, 7); P(ctx, x + w - 20, y + 25, 7); P(ctx, x + w - 29, y + 27, 6); R(ctx, x + w - 22, y + 13, 4, 4, 27); R(ctx, x + w - 21, y + 12, 2, 6, 27); }
  else { R(ctx, x + w - 34, y + 26, 20, 5, 11); E(ctx, x + w - 21, y + 17, 3, 3, 27); }
  R(ctx, x + 8, y + 9, 12, 9, 13); R(ctx, x + 9, y + 10, 10, 7, 29); S(ctx, FXS.heart, x + 11, y + 11, { '#': 28 }); // petit cadre
  const bx = x + (w >> 1) - 10, by = y + h - 13;
  E(ctx, bx, by + 2, 36, 9, 13); E(ctx, bx, by + 1, 35, 8, 14); E(ctx, bx, by, 33, 7, 17);        // panier
  for (let i = -30; i < 31; i += 7) { P(ctx, bx + i, by - 3, 29); P(ctx, bx + i + 2, by - 1, 16); }
  R(ctx, bx - 35, by + 3, 70, 3, 15);
  const n = pigs.length;
  pigs.forEach((p, i) => {
    const span = n > 2 ? 54 : 32, px = bx + (n === 1 ? 0 : -span / 2 + i * (span / Math.max(1, n - 1))), py = by + 1 + (i % 2);

  if (o.hearts) for (let i = 0; i < 4; i++) { const k = (t * 0.7 + i * 0.25) % 1; S(ctx, FXS.heart, Math.round(bx - 22 + i * 14 + Math.sin(t * 2 + i) * 2), Math.round(by - 14 - k * 22), { '#': k > 0.7 ? 24 : 28 }); }

// ---------- la naissance : surprise, nommage, bilan ----------
const TRAIT_LABEL = { couleur: 'la couleur', motif: 'le motif', poil: 'le poil', caractere: 'le caractère' };
const pageLabel = key => { const a = key.split('|'); return cap1(GENES.couleur.label[a[0]]) + ' ' + GENES.motif.label[a[1]]; };
Object.assign(Nurs, {
  openBirth(news, direct) { // news : les annonces du réveil (portée, pages du carnet), ou rien si on reprend après avoir quitté le jeu
    const st = GAME.state, ids = Life.nameless(st).map(p => p.id); if (!ids.length) return;
    UI.close(); UI.nurs = null; this.stopTyping(true);
    const info = { rev: [], pages: [] };
    (news || []).forEach(n => { if (n.k === 'birth') info.rev = n.rev; if (n.k === 'page') info.pages.push(n.key); });
    UI.birth = { step: 'surprise', t: 0, ids: ids, i: 0, info: info, name: '', sug: [], all: ids.slice() };
    if (direct) this.startName(UI.birth); else { AUD.chime(); UI.hintOnce('naissance'); }
  },
  update(dt) {
    const b = UI.birth, a = UI.arrive;
    if (b) { b.t += dt; // un petit couinement à l'apparition de chaque petit dans le panier
      if (b.step === 'surprise') { const n = b.ids.length; b.snd = b.snd | 0;
        while (b.snd < n && b.t >= b.snd * 0.7 + 0.05) { const p = GAME.state.pigs.find(x => x.id === b.ids[b.snd]); AUD.squeak(60 + 30 * b.snd); if (p) AUD.wheek(p, 0.45, 60 + 30 * b.snd); if (p && p.mut) { AUD.chime(); } b.snd++; } } }
    if (a) { a.t += dt; if (!a.w && a.t > 0.45) { a.w = 1; const p = GAME.state.pigs.find(x => x.id === a.id); if (p) AUD.wheek(p, 0.8, 88); } } // l'arrivant se présente
    if (this.typing) this.placeInput();
  },
  cur() { const b = UI.birth; return b && b.step === 'name' ? GAME.state.pigs.find(p => p.id === b.ids[b.i]) : null; },
  roll(b) { // six idées de noms, la première étant celle déjà proposée
    const st = GAME.state, used = Life.usedNames(st).map(n => n.toLowerCase()), rng = mulberry32((Math.random() * 4294967295) >>> 0);
    const pig = this.cur(), out = pig ? [pig.name] : [];
    for (const n of shuffle(rng, NAMES)) { if (out.length >= 6) break; if (used.indexOf(n.toLowerCase()) < 0 && out.indexOf(n) < 0) out.push(n); }
    b.sug = out;
  },
  startName(b) { b.step = 'name'; const pig = this.cur(); b.name = pig ? pig.name : ''; this.roll(b); },
  taken(name, except) { const l = name.toLowerCase(); return GAME.state.pigs.concat(GAME.state.nursery ? GAME.state.nursery.pigs : []).some(p => p !== except && p.name.toLowerCase() === l); },

  // saisie libre : un vrai champ de texte posé sur le tableau, pour laisser le clavier du téléphone s'ouvrir
  startTyping() {
    const b = UI.birth; if (!b || this.typing) return;
    const inp = document.createElement('input'); inp.type = 'text'; inp.maxLength = 14; inp.value = b.name; inp.autocomplete = 'off'; inp.autocapitalize = 'words'; inp.spellcheck = false; inp.setAttribute('aria-label', 'Nom du cochon');
    Object.assign(inp.style, { position: 'fixed', zIndex: 20, boxSizing: 'border-box', background: '#fff8e8', color: '#3f2a1e', border: '2px solid #6b4a30', borderRadius: '2px', outline: 'none', textAlign: 'center', fontFamily: 'monospace', fontWeight: 'bold', padding: '0' });
    inp.addEventListener('input', () => { const c = nameClean(inp.value); if (c !== inp.value) inp.value = c; b.name = c; });
    inp.addEventListener('keydown', ev => { ev.stopPropagation(); if (ev.key === 'Enter') { ev.preventDefault(); this.stopTyping(false); } else if (ev.key === 'Escape') { ev.preventDefault(); this.stopTyping(true); } });
    inp.addEventListener('blur', () => { if (this.typing === inp) this.stopTyping(false); });
    document.body.appendChild(inp); this.typing = inp; this.placeInput(); inp.focus(); inp.select();
  },
  placeInput() {
    const inp = this.typing, r = GAME.toCss ? GAME.toCss(this.nameBox.x, this.nameBox.y, this.nameBox.w, this.nameBox.h) : null; if (!inp || !r) return;
    inp.style.left = r.left + 'px'; inp.style.top = r.top + 'px'; inp.style.width = r.width + 'px'; inp.style.height = r.height + 'px'; inp.style.fontSize = Math.max(12, r.height * 0.55) + 'px';
  },
  stopTyping(cancel) {
    const inp = this.typing; if (!inp) return; this.typing = null;
    const b = UI.birth, v = nameClean(inp.value).trim();
    if (b && !cancel && v) b.name = v; else if (b && !b.name.trim()) { const p = this.cur(); b.name = p ? p.name : ''; }
    try { inp.remove(); } catch (e) { /* déjà retiré */ }
  },
  nameBox: { x: 16, y: 120, w: 144, h: 18 },

  actBirth(h) {
    const b = UI.birth, st = GAME.state; if (!b) return;
    switch (h.id) {
      case 'nb-start': this.startName(b); AUD.pop(); break;
      case 'nb-chip': b.name = h.data; AUD.pop(); break;
      case 'nb-roll': this.roll(b); AUD.pop(); break;
      case 'nb-type': this.startTyping(); break;
      case 'nb-ok': {
        const pig = this.cur(); if (!pig) break;
        const nm = nameClean(b.name).trim();
        if (!nm) { UI.toast('Un nom, vite !', 'Choisissez un nom ou écrivez-en un.', 'nb'); break; }
        if (this.taken(nm, pig)) { UI.toast('Déjà pris', nm + ' vit déjà au refuge : choisissez-en un autre.', 'nb'); break; }
        pig.name = nm; pig.nn = false; Save.dirty(); AUD.chime(); for (let i = 0; i < 6; i++) FX.spark(88, 100);
        if (b.i + 1 < b.ids.length) { b.i++; this.startName(b); } else { b.step = 'done'; b.t = 0; Save.flush(); }
        break;
      }
      case 'nb-close': UI.birth = null; AUD.back(); if (st.pigs.some(p => p.mut)) UI.hintOnce('mutation'); break;
    }
  },
  drawBirth(ctx) {
    const b = UI.birth, st = GAME.state; if (!b) return;
    UI.reg('nb-bg', 0, 0, G.W, G.H); dimLayer(ctx);
    const px = 8, pw = 160, pigs = b.all.map(id => st.pigs.find(p => p.id === id)).filter(Boolean);
    if (b.step === 'surprise') {

/* ---- 13_season.js ---- */
/* ==== 13 · les saisons : 12 jours chacune, trois objectifs, le grand rendez-vous de fin de saison, les accessoires ====
   Rien ne punit : un objectif manqué ne retire rien, un concours perdu rapporte quand même un cadeau.
   La saison se déduit toujours du jour (jour 1 à 12 : printemps, 13 à 24 : été, etc.), la sauvegarde ne garde que les compteurs. */
const RAR = (function () { // plage de « rareté » : somme des -ln(fréquence) sur couleur, motif, poil
  let lo = 0, hi = 0;
  for (const g of ['couleur', 'motif', 'poil']) {
    const w = GENES[g].w, v = Object.keys(w).map(k => w[k]), tot = v.reduce((a, b) => a + b, 0);
    lo += -Math.log(Math.max.apply(null, v) / tot); hi += -Math.log(Math.min.apply(null, v) / tot);
  }
  return { lo: lo, hi: hi };
})();

const Season = {
  keyOf(day) { return SEASON_KEYS[Math.floor((Math.max(1, day) - 1) / SEASON_DAYS) % SEASON_KEYS.length]; },
  numOf(day) { return Math.floor((Math.max(1, day) - 1) / SEASON_DAYS); },
  dayIn(day) { return (Math.max(1, day) - 1) % SEASON_DAYS + 1; },
  info(st) { return SEASON_INFO[this.keyOf(st.day)]; },
  eventDays(st) { return SEASON_DAYS - this.dayIn(st.day); },     // jours restants avant le soir du rendez-vous
  contestDue(st) { return this.dayIn(st.day) === SEASON_DAYS && !(st.sea && st.sea.done); },
  seedBonus(st, seed) { return SEED_SEASON[this.keyOf(st.day)].indexOf(seed) >= 0 ? SEASON_BONUS : 0; },
  weights(st, w) { const m = this.info(st).needs; for (const k in m) if (w[k] != null) w[k] *= m[k]; return w; },

  // ---------- état de la saison ----------
  target(k, np) { const o = SEASON_OBJ[k]; return clamp(Math.round(o.per * np) + o.min, o.min, o.max); },
  fresh(st) {
    const n = this.numOf(st.day), r = mulberry32((hash32(st.seed + ':sea:' + n) ^ 0x51ed) >>> 0), np = Math.max(2, st.pigs.length);
    const pool = shuffle(r, OBJ_KEYS.slice()).slice(0, 3);
    return { n: n, c: { pop: 0, cal: 0, brs: 0, veg: 0, lettre: 0, manie: 0 }, obj: pool.map(k => ({ k: k, t: this.target(k, np), d: false })), done: false, ev: Rare.pickMoment(r) };
  },
  sync(st) { // au chargement et à chaque jour qui commence
    st.season = this.keyOf(st.day);
    if (!st.sea || st.sea.n !== this.numOf(st.day)) { st.sea = this.fresh(st); for (const p of st.pigs) p.ss = { p: 0, c: 0, b: 0 }; return true; }
    return false;
  },
  dayStart(st, news) { if (this.sync(st)) { news.push({ k: 'season', key: this.keyOf(st.day) }); Life.changed = true; } }, // le décor change : le refuge se recompose pendant le fondu

  // ---------- compteurs et objectifs ----------
  bump(k, n, pig) {
    const st = GAME.state; if (!st || !st.sea) return; n = n == null ? 1 : n;
    st.sea.c[k] = (st.sea.c[k] | 0) + n;
    if (pig) { pig.ss = pig.ss || { p: 0, c: 0, b: 0 }; const m = { pop: 'p', cal: 'c', brs: 'b' }[k]; if (m) pig.ss[m] += n; }
    let fin = false;
    for (const o of st.sea.obj) if (!o.d && o.k === k && st.sea.c[k] >= o.t) { o.d = true; fin = true; UI.toast('Objectif atteint !', SEASON_OBJ[o.k].label.replace('{n}', o.t) + '.', 'obj'); AUD.chime(); Care.gain(OBJ_REWARD.c, 88, 150, 'clover'); }
    if (fin && st.sea.obj.every(o => o.d) && !st.sea.all) { st.sea.all = true; UI.toast('Saison remplie !', 'Les trois objectifs sont atteints : bravo.', 'obj'); Care.gain(OBJ_ALL.h, 88, 140); }
    Save.dirty();
  },
  prog(o) { const st = GAME.state; return Math.min(o.t, st.sea.c[o.k] | 0); },

  // ---------- le jury ----------
  rarity(pig) {
    const ph = phenotype(pig); let L = 0;
    for (const g of ['couleur', 'motif', 'poil']) { const w = GENES[g].w; let tot = 0; for (const k in w) tot += w[k]; L += -Math.log(w[ph[g]] / tot); }
    return clamp((L - RAR.lo) / (RAR.hi - RAR.lo), 0, 1);
  },
  lien(pig) { return BOND_STEPS.filter(s => (pig.bond | 0) >= s).length; },
  score(cat, pig) {
    const ss = pig.ss || { p: 0, c: 0, b: 0 };
    switch (cat) {
      case 'beau':  return clamp(Math.round(8 + ss.b * 7 + this.lien(pig) * 3 + this.rarity(pig) * 16), 0, 100);
      case 'pop':   return clamp(Math.round(8 + ss.p * 2), 0, 100);
      case 'calin': return clamp(Math.round(8 + ss.c * 7 + this.lien(pig) * 4), 0, 100);
      default:      return clamp(Math.round(this.rarity(pig) * 105 + 8), 0, 100);
    }
  },
  hint(cat, pig) { // ce que le jury a vu : en mots, jamais en chiffres
    const ss = pig.ss || { p: 0, c: 0, b: 0 }, lv = this.lien(pig);
    switch (cat) {
      case 'beau':  return ss.b >= 3 ? 'Souvent brossé' : ss.b >= 1 ? 'Un peu brossé' : 'Pelage ordinaire';
      case 'pop':   return ss.p >= 25 ? 'Sauteur infatigable' : ss.p >= 10 ? 'Quelques bonds' : 'Plutôt calme';
      case 'calin': return ss.c >= 3 ? 'Câlins à gogo' : ss.c >= 1 ? 'Quelques câlins' : 'Plutôt réservé';
      default:      { const r = this.rarity(pig); return r > 0.62 ? 'Pelage rare' : r > 0.38 ? 'Assez peu courant' : 'Pelage courant'; }
    }
  },
  medalOf(sc, n) { const up = Math.min(14, n * 2); return sc >= MEDAL_AT[0] + up ? 0 : sc >= MEDAL_AT[1] + up ? 1 : sc >= MEDAL_AT[2] + up ? 2 : 3; },
  rival(st, ci, i) { // un concurrent d'une autre ferme : nom et origine tirés d'une table, stables pour une saison donnée
    const h = hash32(st.seed + ':riv:' + st.sea.n + ':' + ci + ':' + i);
    return { n: RIVALS[h % RIVALS.length], f: RIVAL_FROM[(h >>> 8) % RIVAL_FROM.length], s: (h ^ 0x9e3779b9) >>> 0 || 1 };
  },
  podium(st, ci, medal, pig) { // trois places : le cochon du joueur s'y trouve s'il est dans les trois premiers
    const used = {}, out = []; let k = 0;
    for (let place = 0; place < 3; place++) {
      if (place === medal) { out.push({ me: true, n: pig.name, id: pig.id }); continue; }
      let r = this.rival(st, ci, k++); let g = 0; while (used[r.n] && g++ < 12) r = this.rival(st, ci, k++);
      used[r.n] = 1; out.push({ me: false, n: r.n, f: r.f, s: r.s });
    }
    return out;
  },
  results(st, picks) { // une entrée par catégorie inscrite ; le même cochon donne toujours le même résultat
    const res = [], n = st.sea.n;
    CONTEST.forEach((c, ci) => {
      const pig = st.pigs.find(p => p.id === picks[ci]); if (!pig) return;
      const sc = this.score(c.k, pig), medal = this.medalOf(sc, n);
      res.push({ ci: ci, cat: c.k, id: pig.id, name: pig.name, score: sc, medal: medal, podium: this.podium(st, ci, medal, pig) });
    });
    return res;
  },

  // ---------- accessoires ----------
  owned(st) { return (st.accs || []).filter(k => ACC[k]); },
  wearer(st, k) { return st.pigs.find(p => p.acc === k) || null; },
  give(st, k) { st.accs = st.accs || []; if (ACC[k] && st.accs.indexOf(k) < 0) { st.accs.push(k); return true; } return false; },
  wear(pig, k) { // un accessoire n'habille qu'un cochon à la fois
    const st = GAME.state; if (k && st.pigs.some(p => p !== pig && p.acc === k)) st.pigs.forEach(p => { if (p.acc === k) delete p.acc; });
    if (k) pig.acc = k; else delete pig.acc; Save.dirty();
  },

  // ---------- le rendez-vous ----------
  openContest() {
    const st = GAME.state; UI.close(); UI.card = null; UI.settings = false;
    UI.contest = { step: 'intro', ci: 0, picks: [null, null, null, null], sel: null, page: 0, res: null, ri: 0, t: 0, t0: UI.t };
    AUD.fanfare(); UI.hintOnce('concours');
  },
  rewardOf(r) { const m = MEDALS[r.medal]; return { c: m.c, h: m.h }; },
  conclude() { // le soir du rendez-vous est terminé : on remet les cadeaux, une fois pour toutes
    const st = GAME.state, k = this.keyOf(st.day), info = SEASON_INFO[k], c = UI.contest; if (!c || !c.res) return;
    let ch = 0, cc = 0, gifts = [], best = null;
    st.golds = st.golds | 0;
    for (const r of c.res) {
      const rw = this.rewardOf(r); ch += rw.h; cc += rw.c;
      if (r.medal === 0) { const a = ACC_GOLD[st.golds]; st.golds++; if (a && this.give(st, a)) gifts.push(a); else cc += 4; }
      if (!best || r.medal < best.medal) best = r;
    }
    st.inv = st.inv || {}; st.inv[info.gift.deco] = Math.min(9, (st.inv[info.gift.deco] | 0) + 1);
    if (this.give(st, info.gift.acc)) gifts.push(info.gift.acc);
    st.hall = st.hall || [];
    const champ = best && st.pigs.find(p => p.id === best.id);
    st.hall.push({ n: st.sea.n, key: k, m: best ? best.medal : 3, cat: best ? best.cat : 'beau', pig: champ ? { n: champ.name, s: champ.seed, k: phenoKeys(champ) } : null, r: c.res.map(r => ({ cat: r.cat, m: r.medal })) });
    if (st.hall.length > 8) st.hall.shift();
    Rare.noteChamp(st, k, best, champ);
    st.sea.done = true; c.gifts = gifts; c.rew = { h: ch, c: cc, deco: info.gift.deco };
    if (cc) Care.gain(cc, 88, 120, 'clover'); if (ch) Care.gain(ch, 88, 130);
    Save.dirty();
  },
  closeContest() { UI.contest = null; Care.endDay(); },

  // ---------- interface : panneau « Saison » ----------
  open() { UI.close(); UI.season = true; AUD.pop(); UI.hintOnce('saison'); },
  act(h) {
    const st = GAME.state, c = UI.contest;
    switch (h.id) {
      case 'se-close': UI.season = false; AUD.back(); break;
      case 'se-bg': if (!c) { UI.season = false; AUD.back(); } break;
      case 'se-go': c.step = 'pick'; c.ci = 0; c.sel = null; c.page = 0; AUD.pop(); break;
      case 'se-row': c.sel = h.data; AUD.pop(); break;
      case 'se-prev': c.page = Math.max(0, c.page - 1); AUD.pop(); break;
      case 'se-next': c.page = c.page + 1; AUD.pop(); break;
      case 'se-ok': case 'se-skip': {
        if (h.id === 'se-ok' && !c.sel) { UI.toast('Choisissez un cochon', 'Touchez celui que vous voulez inscrire.', 'se'); break; }
        c.picks[c.ci] = h.id === 'se-ok' ? c.sel : null; c.sel = null; c.page = 0; AUD.pop();
        if (c.ci < CONTEST.length - 1) c.ci++;
        else { c.res = this.results(st, c.picks); c.step = c.res.length ? 'result' : 'bilan'; c.ri = 0; c.t0 = UI.t; if (!c.res.length) this.conclude(); }
        break;
      }
      case 'se-next-res': c.ri++; c.t0 = UI.t; AUD.pop(); if (c.ri >= c.res.length) { c.step = 'bilan'; this.conclude(); AUD.fanfare(); } break;
      case 'se-end': this.closeContest(); break;
      // habits (page de la fiche)
      case 'se-acc': { const pig = UI.card && UI.card.pig; if (!pig) break; this.wear(pig, pig.acc === h.data ? null : h.data); AUD.pop(); FX.spark(88, 120); break; }
    }

  drawRibbon(ctx, cx, y, medal) { // petite rosette

  draw(ctx) { // panneau d'information

    const px = 8, pw = 160, intro = FONT.wrap(info.intro, 140), n = st.sea.obj.length;

    for (let i = 0; i < SEASON_DAYS; i++) { const x0 = px + 12 + i * 11; R(ctx, x0, y, 9, 5, 13); R(ctx, x0 + 1, y + 1, 7, 3, i < d ? 27 : 17); }

  drawContest(ctx) {

const UI = {

  }

  // ---------- erreurs : on continue, on prévient, on n'efface jamais la partie ----------
  function onError(e, where) {
    const msg = (e && e.stack ? e.stack.split('\n').slice(0, 3).join(' | ') : String(e));
    if (!errSeen[msg]) { errSeen[msg] = 1; try { console.error('[clos] ' + where + ' : ' + msg); } catch (x) { /* rien */ } }
    if (++errRun > 40 && !fatal) { fatal = true; const d = document.getElementById('err'); if (d) d.style.display = 'flex'; try { Save.flush(true); } catch (x) { /* rien */ } }
  }
  window.addEventListener('error', ev => onError(ev.error || ev.message, 'fenêtre'));
  window.addEventListener('unhandledrejection', ev => onError(ev.reason, 'promesse'));

  function frame(ts) {
    requestAnimationFrame(frame);
    if (!last) last = ts;
    let dt = (ts - last) / 1000; last = ts; if (dt > 0.1) dt = 0.1; if (dt < 0) dt = 0;
    if (document.hidden || fatal) return;
    try { update(dt); render(); errRun = 0; } catch (e) { onError(e, 'boucle'); }
    present();
  }

  // ---------- entrées ----------
  let activeId = null;
  function lp(ev) { const r = view.getBoundingClientRect(); return [((ev.clientX - r.left) * dpr - ox) / S, ((ev.clientY - r.top) * dpr - oy) / S]; }
  view.addEventListener('pointerdown', ev => {
    ev.preventDefault(); if (activeId !== null) return; activeId = ev.pointerId;
    try { view.setPointerCapture(ev.pointerId); } catch (e) { /* ok */ }
    AUD.init(); if (AUD.ctx) AUD.setOn(GAME.state.settings.sound);
    const p = lp(ev); Care.press(p[0], p[1]); UI.press(p[0], p[1]);
  });
  view.addEventListener('pointermove', ev => {
    if (ev.pointerId !== activeId) return; ev.preventDefault();
    const p = lp(ev); try { Care.move(p[0], p[1]); } catch (e) { onError(e, 'geste'); }
  });
  view.addEventListener('pointerup', ev => {
    ev.preventDefault(); if (ev.pointerId !== activeId) return; activeId = null;
    AUD.init(); const p = lp(ev);
    try { if (Care.release(p[0], p[1])) { UI.pressed = null; UI.down = false; } else UI.release(p[0], p[1]); } catch (e) { onError(e, 'appui'); }
  });
  view.addEventListener('pointercancel', ev => { if (ev.pointerId === activeId) { activeId = null; UI.pressed = null; UI.down = false; Care.pend = null; Care.drag = null; } });
  view.addEventListener('contextmenu', ev => ev.preventDefault());
  window.addEventListener('keydown', ev => {
    if (ev.key === 'Enter' || ev.key === ' ') { if (UI.screen === 'title') { ev.preventDefault(); AUD.init(); UI.enter(); } }
    else if (ev.key === 'Escape') { if (UI.card) UI.card = null; else if (UI.comfort) UI.closeComfort(); else if (UI.bu) { if (Backup.conf) Backup.conf = null; else UI.closeBackup(); } else if (UI.settings) UI.settings = false; else if (UI.place) Deco.store(); else if (UI.photo) Photo.stop(); else if (UI.album) { if (UI.album.view >= 0) UI.album.view = -1; else UI.album = null; } else if (UI.modal()) UI.close(); else if (UI.screen === 'gallery') UI.screen = 'play'; }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { try { Save.flush(); } catch (e) { /* rien */ } }
    else { last = 0; try { if (AUD.ctx && AUD.ctx.state === 'suspended') AUD.ctx.resume(); } catch (e) { /* rien */ } }
  });
  window.addEventListener('pagehide', () => { try { Save.flush(); } catch (e) { /* rien */ } });
  window.addEventListener('resize', resize); window.addEventListener('orientationchange', resize);

  // ---------- démarrage ----------
  resize();
  GAME.world = buildWorld('printemps');
  GAME.env = { world: GAME.world, ents: [], time: 0, playing: false, discover: discover };
  GAME.rebuild(Save.load());
  Save.initRemote(function (st) { if (UI.screen === 'title') { Save.adopt(st); GAME.rebuild(st); } });
  requestAnimationFrame(frame);

  // pour les tests automatiques : avance le temps sans dessiner
  window.CLOS = {
    Access: Access, FONT: FONT, G: G, GAME: GAME, UI: UI, Save: Save, AUD: AUD, FX: FX, BFLY: BFLY, Care: Care, Time: Time, Garden: Garden, Mail: Mail, Deco: Deco, Coin: Coin, Photo: Photo, Backup: Backup, Market: Market, Life: Life, Arrive: Arrive, Season: Season, Rare: Rare, DATA: { vetAdvice: vetAdvice, crossPig: crossPig, crossOdds: crossOdds, revealCarriers: revealCarriers, makePig: makePig, phenotype: phenotype, GENES: GENES, parentRec: parentRec }, Nurs: Nurs, Book: Book, Adopt: Adopt,
    ptr: function (type, x, y) { // pointeur logique (tests) : mêmes chemins que les vrais événements
      if (type === 'down') { Care.press(x, y); UI.press(x, y); } else if (type === 'move') Care.move(x, y); else if (Care.release(x, y)) { UI.pressed = null; UI.down = false; } else UI.release(x, y);
    },
    step: function (sec) { const n = Math.round(sec * 30); for (let i = 0; i < n; i++) update(1 / 30); render(); present(); },
    info: function () { return { scale: S, ox: ox, oy: oy, dpr: dpr, w: view.width, h: view.height, errors: Object.keys(errSeen) }; },
    screenToLogical: function (cx, cy) { const r = view.getBoundingClientRect(); return [((cx - r.left) * dpr - ox) / S, ((cy - r.top) * dpr - oy) / S]; }
  };
})();

</script>

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
</script>
