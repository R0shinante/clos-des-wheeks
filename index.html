<script>
'use strict';
/* ---- 00_access.js ---- */
/* ==== 00 · confort de jeu : mode calme, contraste fort, messages longs, volume, bruits de fond ====
   Ces réglages sont rangés à part de la partie (clé « clos-wheeks-confort ») : « Nouvelle partie » ne les efface pas.
   - Mode calme : plus de scintillement ni de flash (particules qui s'éteignent d'un coup, étincelles, lucioles, papillons,
     coins de la pose, flash de l'appareil, bandeaux), moitié moins de pétales, sons un peu plus doux, oiseaux plus rares.
   - Contraste fort : ne change aucun dessin, seulement la couleur des textes, choisie pour tenir au moins 7:1 sur le fond réel.
   - Messages longs : les bandeaux restent deux fois plus longtemps.
   - Volume (doux / normal / fort) et bruits de fond (oiseaux, grillons, vent) : voir 07_audio.js. */
const Access = {
  K: 'clos-wheeks-confort',
  calm: false, hi: false, slow: false, vol: 1, amb: true, mem: null, ok: true,
  VOLS: [{ n: 'Doux', g: 0.35 }, { n: 'Normal', g: 0.7 }, { n: 'Fort', g: 1.4 }],
  MIN_RATIO: 7, // lisibilité visée en contraste fort (niveau AAA)
  // texte foncé de remplacement sur fond clair, clair sur fond sombre (même famille de teinte quand c'est possible)
  DARK: { 14: 13, 15: 13, 16: 13, 17: 13, 19: 18, 20: 18, 21: 13, 22: 18, 23: 18, 28: 18, 10: 8, 11: 8, 12: 8, 31: 8, 25: 2, 26: 2, 3: 2, 4: 2, 5: 2, 27: 13, 30: 2, 24: 13, 29: 13, 6: 1, 7: 0 },
  LIGHT: { 13: 7, 14: 29, 15: 17, 18: 24, 19: 24, 8: 12, 9: 12, 10: 12, 2: 7, 1: 7, 0: 7, 3: 6, 28: 23 },
  _L: null, _idx: null,

  sane(o) { // lit des valeurs abîmées sans jamais échouer
    o = o && typeof o === 'object' ? o : {};
    this.calm = o.calm === true; this.hi = o.hi === true; this.slow = o.slow === true; this.amb = o.amb !== false;
    const v = o.vol | 0; this.vol = v >= 0 && v <= 2 && o.vol === v ? v : 1;
  },
  load() {
    let raw = null;
    try { const s = window.localStorage; if (s) raw = s.getItem(this.K); } catch (e) { this.ok = false; }
    let o = null; try { o = raw ? JSON.parse(raw) : (this.mem ? JSON.parse(this.mem) : null); } catch (e) { o = null; }
    this.sane(o);
  },
  save() {
    const s = JSON.stringify({ calm: this.calm, hi: this.hi, slow: this.slow, vol: this.vol, amb: this.amb }); this.mem = s;
    try { const ls = window.localStorage; if (ls) { ls.setItem(this.K, s); this.ok = true; } } catch (e) { this.ok = false; }
  },
  set(k, v) { // k : calm | hi | slow | amb | vol
    this[k] = k === 'vol' ? Math.max(0, Math.min(2, v | 0)) : !!v; this.save();
    if (typeof AUD !== 'undefined') { AUD.setOn(AUD.on); AUD.setAmb(); }
  },
  gain() { return this.VOLS[this.vol].g * (this.calm ? 0.8 : 1); }, // gain maître avant le compresseur
  toastSec() { return this.slow ? 9.2 : 4.6; },

  // ----- contraste fort : couleur de texte choisie d'après le fond réellement dessous -----
  tables() {
    if (this._L) return;
    const f = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
    this._L = PAL_RGB.map(c => 0.2126 * f(c[0]) + 0.7152 * f(c[1]) + 0.0722 * f(c[2]));
    this._idx = new Map(); PAL_RGB.forEach((c, i) => this._idx.set((c[0] << 16) | (c[1] << 8) | c[2], i));
  },
  ratio(a, b) { return (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05); },
  fix(ctx, str, x, y, ci, sc) { // renvoie la couleur à employer pour ce texte
    try {
      this.tables(); const cv = ctx.canvas; if (!cv || !ctx.getImageData) return ci;
      const x0 = Math.max(0, x | 0), y0 = Math.max(0, y | 0), w = Math.min(cv.width - x0, FONT.width(str, sc)), h = Math.min(cv.height - y0, 7 * sc);
      if (w <= 0 || h <= 0) return ci;
      const d = ctx.getImageData(x0, y0, w, h).data, cnt = new Map(); let best = 0, bk = 0;
      for (let i = 0; i < d.length; i += 4) { const k = (d[i] << 16) | (d[i + 1] << 8) | d[i + 2], n = (cnt.get(k) || 0) + 1; cnt.set(k, n); if (n > best) { best = n; bk = k; } }
      const bi = this._idx.get(bk), Lb = bi != null ? this._L[bi] : this.lumOf(bk), L = this._L;
      if (this.ratio(L[ci], Lb) >= this.MIN_RATIO) return ci;
      const light = Lb > 0.25; let c = (light ? this.DARK : this.LIGHT)[ci]; if (c == null) c = light ? 13 : 7;
      if (this.ratio(L[c], Lb) < this.MIN_RATIO) c = this.ratio(L[1], Lb) >= this.ratio(L[7], Lb) ? 1 : 7;
      return c;
    } catch (e) { return ci; }
  },
  lumOf(k) { const f = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }; return 0.2126 * f(k >> 16) + 0.7152 * f((k >> 8) & 255) + 0.0722 * f(k & 255); }
};
Access.load();

/* ---- 00_core.js ---- */
/* ==== 00 · noyau : constantes, palette (32 couleurs), hasard, utilitaires ==== */
const G = { W: 176, H: 320, T: 16, VERSION: 1, time: 0 };

// Palette unique du jeu : crème, terracotta, vert sauge, bois miel, rose poudré, ombres violettes.
const PAL_HEX = [
  '#1b171e', '#2e2931', '#423c47', '#686070', '#9d959f', '#c7bfc5', '#ece6dc', '#fff8e8', //  0- 7 gris chauds & crèmes
  '#243d27', '#3d5f2f', '#5f8a3a', '#88ad4a', '#bccf80', '#3f2a1e', '#6b4a30', '#956a40', //  8-15 verts & bois
  '#c29963', '#e2c48e', '#6a3030', '#a8472f', '#cf7a3e', '#eea363', '#cc8c98', '#e8b6bc', // 16-23 terre, roux, roses
  '#f6d8d2', '#7c9cc2', '#b4cfdb', '#ecc455', '#d65a75', '#f0dfae', '#8a68ae', '#a1c05e'  // 24-31 ciel, or, cœur, beurre, lilas, herbe claire
];
const PAL_RGB = PAL_HEX.map(h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);

// Rampes de pelage : o = contour (coloré, jamais noir), s = ombre, b = base, h = lumière.
const RAMP = {
  noir:     { o: 0,  s: 1,  b: 2,  h: 3 },
  chocolat: { o: 1,  s: 13, b: 14, h: 15 },
  roux:     { o: 18, s: 19, b: 20, h: 21 },
  creme:    { o: 16, s: 17, b: 29, h: 7 },
  blanc:    { o: 4,  s: 5,  b: 6,  h: 7 },
  lilas:    { o: 2,  s: 3,  b: 4,  h: 5 },
  peau:     { o: 19, s: 22, b: 23, h: 24 }
};
const TONES = ['o', 's', 'b', 'h']; // tons 0..3

// ---- hasard déterministe ----
function hash32(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash2(x, y, s) {
  let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul((s | 0) + 1, 2147483647);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function valueNoise(x, y, scale, seed) {
  const gx = x / scale, gy = y / scale, x0 = Math.floor(gx), y0 = Math.floor(gy);
  const fx = gx - x0, fy = gy - y0;
  const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  const a = hash2(x0, y0, seed), b = hash2(x0 + 1, y0, seed), c = hash2(x0, y0 + 1, seed), d = hash2(x0 + 1, y0 + 1, seed);
  return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
}
const BAYER4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
function bayer(x, y) { return (BAYER4[((y & 3) << 2) | (x & 3)] + 0.5) / 16; }

// ---- utilitaires ----
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rr = (rng, a, b) => a + (b - a) * rng();
const pick = (rng, arr) => arr[Math.floor(rng() * arr.length) % arr.length];
function wpick(rng, table) { // table : {clé: poids}
  let tot = 0; for (const k in table) tot += table[k];
  let r = rng() * tot;
  for (const k in table) { r -= table[k]; if (r <= 0) return k; }
  return Object.keys(table)[0];
}
function shuffle(rng, arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);

/* ---- 01_font.js ---- */
/* ==== 01 · police pixel 5x7 avec accents français ==== */
// Chaque glyphe : [ligne de départ, 'rangée/rangée/…'] ; ligne 0 = haut des majuscules, x-height = lignes 2-6, jambages = 7-8.
const FONT = (function () {
  const GL = {};
  const d = (ch, y0, rows) => { GL[ch] = { y0: y0, rows: rows.split('/') }; };
  // majuscules
  d('A', 0, '.###./#...#/#...#/#####/#...#/#...#/#...#');
  d('B', 0, '####./#...#/#...#/####./#...#/#...#/####.');
  d('C', 0, '.###./#...#/#..../#..../#..../#...#/.###.');
  d('D', 0, '####./#...#/#...#/#...#/#...#/#...#/####.');
  d('E', 0, '#####/#..../#..../####./#..../#..../#####');
  d('F', 0, '#####/#..../#..../####./#..../#..../#....');
  d('G', 0, '.###./#...#/#..../#.###/#...#/#...#/.###.');
  d('H', 0, '#...#/#...#/#...#/#####/#...#/#...#/#...#');
  d('I', 0, '###/.#./.#./.#./.#./.#./###');
  d('J', 0, '..###/...#./...#./...#./...#./#..#./.##..');
  d('K', 0, '#...#/#..#./#.#../##.../#.#../#..#./#...#');
  d('L', 0, '#..../#..../#..../#..../#..../#..../#####');
  d('M', 0, '#...#/##.##/#.#.#/#.#.#/#...#/#...#/#...#');
  d('N', 0, '#...#/##..#/#.#.#/#..##/#...#/#...#/#...#');
  d('O', 0, '.###./#...#/#...#/#...#/#...#/#...#/.###.');
  d('P', 0, '####./#...#/#...#/####./#..../#..../#....');
  d('Q', 0, '.###./#...#/#...#/#...#/#.#.#/#..#./.##.#');
  d('R', 0, '####./#...#/#...#/####./#.#../#..#./#...#');
  d('S', 0, '.####/#..../#..../.###./....#/....#/####.');
  d('T', 0, '#####/..#../..#../..#../..#../..#../..#..');
  d('U', 0, '#...#/#...#/#...#/#...#/#...#/#...#/.###.');
  d('V', 0, '#...#/#...#/#...#/#...#/#...#/.#.#./..#..');
  d('W', 0, '#...#/#...#/#...#/#.#.#/#.#.#/##.##/#...#');
  d('X', 0, '#...#/#...#/.#.#./..#../.#.#./#...#/#...#');
  d('Y', 0, '#...#/#...#/.#.#./..#../..#../..#../..#..');
  d('Z', 0, '#####/....#/...#./..#../.#.../#..../#####');
  // chiffres
  d('0', 0, '.###./#...#/#..##/#.#.#/##..#/#...#/.###.');
  d('1', 0, '..#../.##../..#../..#../..#../..#../.###.');
  d('2', 0, '.###./#...#/....#/...#./..#../.#.../#####');
  d('3', 0, '.###./#...#/....#/..##./....#/#...#/.###.');
  d('4', 0, '...#./..##./.#.#./#..#./#####/...#./...#.');
  d('5', 0, '#####/#..../####./....#/....#/#...#/.###.');
  d('6', 0, '..##./.#.../#..../####./#...#/#...#/.###.');
  d('7', 0, '#####/....#/...#./..#../.#.../.#.../.#...');
  d('8', 0, '.###./#...#/#...#/.###./#...#/#...#/.###.');
  d('9', 0, '.###./#...#/#...#/.####/....#/...#./.##..');
  // minuscules
  d('a', 2, '.###./....#/.####/#...#/.####');
  d('b', 0, '#..../#..../####./#...#/#...#/#...#/####.');
  d('c', 2, '.###./#...#/#..../#...#/.###.');
  d('d', 0, '....#/....#/.####/#...#/#...#/#...#/.####');
  d('e', 2, '.###./#...#/#####/#..../.###.');
  d('f', 0, '..##./.#..#/.#.../###../.#.../.#.../.#...');
  d('g', 2, '.####/#...#/#...#/#...#/.####/....#/.###.');
  d('h', 0, '#..../#..../####./#...#/#...#/#...#/#...#');
  d('i', 0, '.#./.../##./.#./.#./.#./###');
  d('ı', 2, '##./.#./.#./.#./###');           // i sans point
  d('j', 0, '..#./..../.##./..#./..#./..#./..#./#.#./.#..');
  d('k', 0, '#..../#..../#..#./#.#../##.../#.#../#..#.');
  d('l', 0, '##./.#./.#./.#./.#./.#./###');
  d('m', 2, '##.#./#.#.#/#.#.#/#.#.#/#.#.#');
  d('n', 2, '####./#...#/#...#/#...#/#...#');
  d('o', 2, '.###./#...#/#...#/#...#/.###.');
  d('p', 2, '####./#...#/#...#/#...#/####./#..../#....');
  d('q', 2, '.####/#...#/#...#/#...#/.####/....#/....#');
  d('r', 2, '#.##./##..#/#..../#..../#....');
  d('s', 2, '.####/#..../.###./....#/####.');
  d('t', 1, '.#.../###../.#.../.#.../.#..#/..##.');
  d('u', 2, '#...#/#...#/#...#/#...#/.####');
  d('v', 2, '#...#/#...#/#...#/.#.#./..#..');
  d('w', 2, '#...#/#...#/#.#.#/#.#.#/.#.#.');
  d('x', 2, '#...#/.#.#./..#../.#.#./#...#');
  d('y', 2, '#...#/#...#/#...#/#...#/.####/....#/.###.');
  d('z', 2, '#####/...#./..#../.#.../#####');
  d('œ', 2, '.##.##./#..#..#/#..####/#..#.../.##.###'); // œ
  d('Œ', 0, '.#####./#..#.../#..###./#..#.../#..#.../#..#.../.#####.'); // Œ
  // ponctuation
  d(' ', 0, '..');
  d('.', 6, '#');
  d(',', 6, '.#/.#/#.');
  d('!', 0, '#/#/#/#/#/././#');
  d('?', 0, '.###./#...#/....#/...#./..#../...../..#..');
  d('-', 4, '###');
  d('+', 2, '.#./.#./###/.#./.#.');
  d('/', 0, '....#/....#/...#./..#../.#.../#..../#....');
  d("'", 0, '#/#');
  d('’', 0, '#/#');
  d('(', 0, '.#/#./#./#./#./#./.#');
  d(')', 0, '#./.#/.#/.#/.#/.#/#.');
  d('%', 0, '##..#/##..#/...#./..#../.#.../#..##/#..##');
  d('«', 3, '.#.#/#.#./.#.#');
  d('»', 3, '#.#./.#.#/#.#.');
  d('…', 6, '#.#.#');
  d('·', 4, '#');
  d('=', 3, '###/.../###');
  d('×', 3, '#.#/.#./#.#');
  d('→', 2, '..#../...#./#####/...#./..#..');
  d('*', 2, '.#./###/.#.');
  GL[':'] = { y0: 3, rows: ['#', '.', '.', '#'] };

  // marques combinantes (positions relatives au centre du glyphe, lignes relatives à "ligne de marque")
  const MARKS = {
    '́': [[1, 0], [0, 1]],            // aigu
    '̀': [[-1, 0], [0, 1]],           // grave
    '̂': [[0, 0], [-1, 1], [1, 1]],   // circonflexe
    '̈': [[-1, 1], [1, 1]],           // tréma
  };

  function glyph(ch) { return GL[ch] || GL['?']; }
  function gw(g) { return g.rows[0].length; }

  // renvoie [{g, mark, cedilla}] pour une chaîne
  function parse(str) {
    const out = [];
    const s = str.normalize('NFD');
    for (let i = 0; i < s.length; i++) {
      const ch = s[i];
      if (MARKS[ch] || ch === '̧') {
        const last = out[out.length - 1];
        if (last) { if (ch === '̧') last.cedilla = true; else last.mark = ch; }
        continue;
      }
      out.push({ ch: ch, mark: null, cedilla: false });
    }
    return out;
  }

  function width(str, scale) {
    scale = scale || 1;
    const p = parse(str); let w = 0;
    for (const c of p) w += gw(glyph(c.ch === 'i' && c.mark ? 'ı' : c.ch)) + 1;
    return Math.max(0, w - 1) * scale;
  }

  // Dessine à (x, y) = coin haut-gauche de la ligne 0 (le haut des majuscules).
  function draw(ctx, str, x, y, ci, scale, raw) { // raw : ombre portée, couleur laissée telle quelle
    scale = scale || 1;
    if (Access.hi && !raw) ci = Access.fix(ctx, str, x, y, ci, scale);
    ctx.fillStyle = PAL_HEX[ci];
    const p = parse(str);
    let cx = x;
    for (const c of p) {
      let chv = c.ch;
      if (chv === 'i' && c.mark) chv = 'ı';
      const g = glyph(chv), w = gw(g);
      for (let r = 0; r < g.rows.length; r++) {
        const row = g.rows[r];
        let run = -1;
        for (let k = 0; k <= row.length; k++) {
          const on = k < row.length && row[k] === '#';
          if (on && run < 0) run = k;
          if (!on && run >= 0) { ctx.fillRect(cx + run * scale, y + (g.y0 + r) * scale, (k - run) * scale, scale); run = -1; }
        }
      }
      if (c.mark) {
        const upper = chv >= 'A' && chv <= 'Z';
        const my = upper ? -2 : 0;
        const mx = Math.floor(w / 2);
        for (const m of MARKS[c.mark]) ctx.fillRect(cx + (mx + m[0]) * scale, y + (my + m[1]) * scale, scale, scale);
      }
      if (c.cedilla) {
        const mx = Math.floor(w / 2);
        ctx.fillRect(cx + mx * scale, y + 7 * scale, scale, scale);
        ctx.fillRect(cx + (mx - 1) * scale, y + 8 * scale, scale, scale);
      }
      cx += (w + 1) * scale;
    }
  }

  // Coupe un texte en lignes de largeur maximale maxW (en pixels, échelle 1).
  function wrap(str, maxW) {
    const words = str.split(' '), lines = [];
    let cur = '';
    for (const w of words) {
      const t = cur ? cur + ' ' + w : w;
      if (width(t) <= maxW || !cur) cur = t; else { lines.push(cur); cur = w; }
    }
    if (cur) lines.push(cur);
    return lines;
  }

  return { draw: draw, width: width, wrap: wrap, LH: 11 };
})();

// Texte avec ombre portée (1 px) — pratique sur les panneaux.
function text(ctx, str, x, y, ci, shadow, scale) {
  scale = scale || 1;
  if (shadow != null) FONT.draw(ctx, str, x + scale, y + scale, shadow, scale, true);
  FONT.draw(ctx, str, x, y, ci, scale);
}

/* ---- 02_gfx.js ---- */
/* ==== 02 · primitives graphiques en pixels nets ==== */
function mkCanvas(w, h) {
  if (typeof G.mk === 'function') return G.mk(w, h);
  const c = document.createElement('canvas'); c.width = w; c.height = h; return c;
}
function ctx2(c, rf) { const x = c.getContext('2d', rf ? { willReadFrequently: true } : undefined); x.imageSmoothingEnabled = false; return x; }

function R(ctx, x, y, w, h, ci) { ctx.fillStyle = PAL_HEX[ci]; ctx.fillRect(x | 0, y | 0, w | 0, h | 0); }
function P(ctx, x, y, ci) { ctx.fillStyle = PAL_HEX[ci]; ctx.fillRect(x | 0, y | 0, 1, 1); }

// Ellipse pleine, bords nets (balayage de lignes).
function E(ctx, cx, cy, rx, ry, ci) {
  ctx.fillStyle = PAL_HEX[ci];
  const y0 = Math.floor(cy - ry), y1 = Math.ceil(cy + ry);
  for (let y = y0; y < y1; y++) {
    const dy = (y + 0.5 - cy) / ry;
    if (dy < -1 || dy > 1) continue;
    const hw = rx * Math.sqrt(1 - dy * dy);
    const xa = Math.round(cx - hw), xb = Math.round(cx + hw);
    if (xb > xa) ctx.fillRect(xa, y, xb - xa, 1);
  }
}
// Ellipse avec contour d'1 px.

// Ellipse à tramage (damier) entre deux couleurs.
function ED(ctx, cx, cy, rx, ry, ciA, ciB, t) { // t = part de B (0..1) selon le tramage de Bayer
  const y0 = Math.floor(cy - ry), y1 = Math.ceil(cy + ry);
  for (let y = y0; y < y1; y++) {
    const dy = (y + 0.5 - cy) / ry; if (dy < -1 || dy > 1) continue;
    const hw = rx * Math.sqrt(1 - dy * dy);
    const xa = Math.round(cx - hw), xb = Math.round(cx + hw);
    for (let x = xa; x < xb; x++) { ctx.fillStyle = PAL_HEX[bayer(x, y) < t ? ciB : ciA]; ctx.fillRect(x, y, 1, 1); }
  }
}

// Ligne de pixels (Bresenham).
function L(ctx, x0, y0, x1, y1, ci) {
  ctx.fillStyle = PAL_HEX[ci];
  x0 |= 0; y0 |= 0; x1 |= 0; y1 |= 0;
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  for (;;) {
    ctx.fillRect(x0, y0, 1, 1);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}

// Tampon : rows = ['.ab.', ...], map = {a: ci, b: ci}
function S(ctx, rows, x, y, map) {
  for (let j = 0; j < rows.length; j++) {
    const row = rows[j];
    for (let i = 0; i < row.length; i++) {
      const ch = row[i];
      if (ch === '.' || ch === ' ') continue;
      const ci = map[ch];
      if (ci == null) continue;
      ctx.fillStyle = PAL_HEX[ci]; ctx.fillRect(x + i, y + j, 1, 1);
    }
  }
}

// Panneau en bois / papier, dessiné par code (9 tranches procédurales).
function panel(ctx, x, y, w, h, o) {
  o = o || {};
  const paper = o.paper != null ? o.paper : 29, paper2 = o.paper2 != null ? o.paper2 : 17;
  R(ctx, x + 1, y, w - 2, h, 13);               // contour bois sombre
  R(ctx, x, y + 1, w, h - 2, 13);
  R(ctx, x + 1, y + 1, w - 2, h - 2, 15);       // cadre bois miel
  R(ctx, x + 1, y + 1, w - 2, 1, 16);           // reflet haut
  R(ctx, x + 1, y + h - 2, w - 2, 1, 14);       // ombre bas
  R(ctx, x + 3, y + 3, w - 6, h - 6, 14);       // liseré intérieur
  R(ctx, x + 4, y + 4, w - 8, h - 8, paper);    // papier
  R(ctx, x + 4, y + h - 5, w - 8, 1, paper2);   // pli du papier
  if (!o.noRivets) { // petits clous
    P(ctx, x + 2, y + 2, 17); P(ctx, x + w - 3, y + 2, 17); P(ctx, x + 2, y + h - 3, 17); P(ctx, x + w - 3, y + h - 3, 17);
  }
}
// Bouton plat en bois (enfoncé = pressed)
function button(ctx, x, y, w, h, pressed, hi) {
  const dy = pressed ? 1 : 0;
  R(ctx, x, y + 2, w, h - 2, 13);
  R(ctx, x, y + dy, w, h - 2, hi ? 17 : 16);
  R(ctx, x + 1, y + dy + 1, w - 2, h - 4, hi ? 29 : 17);
  R(ctx, x + 1, y + dy + 1, w - 2, 1, 7);
  R(ctx, x, y + dy, 1, 1, 0); // coins grignotés
  R(ctx, x + w - 1, y + dy, 1, 1, 0);
}

// ---- fabrique de cochons ----
function expressed(pig, g) {
  const a = pig.genes[g], dom = GENES[g].dom;
  return dom[a[0]] >= dom[a[1]] ? a[0] : a[1];
}
function phenotype(pig) {
  return { couleur: expressed(pig, 'couleur'), motif: expressed(pig, 'motif'), poil: expressed(pig, 'poil'), caractere: expressed(pig, 'caractere') };
}
// Choisit un allèle caché de rang ≤ à celui exprimé (cohérent avec la dominance).
function hiddenAllele(rng, g, exprKey) {
  const def = GENES[g], tab = {};
  for (const k of def.keys) if (def.dom[k] <= def.dom[exprKey]) tab[k] = def.w[k];
  return wpick(rng, tab);
}
let _pigCounter = 0;
function makePig(rng, want, usedNames) {
  want = want || {};
  const pig = { id: 'p' + Date.now().toString(36) + (++_pigCounter), seed: (Math.floor(rng() * 4294967295) >>> 0) || 1, genes: {}, age: 'adulte', born: 0 };
  for (const g of GENE_ORDER) {
    const def = GENES[g];
    const e = want[g] || wpick(rng, def.w);
    pig.genes[g] = [e, hiddenAllele(rng, g, e)];
  }
  const pool = NAMES.filter(n => !(usedNames && usedNames.indexOf(n) >= 0));
  pig.name = want.name || pick(rng, pool.length ? pool : NAMES);
  pig.quirks = shuffle(rng, QUIRK_LIVE).slice(0, 2); pig.known = [];
  const vv = shuffle(rng, VEG); pig.fav = vv[0]; pig.hate = vv[1]; pig.bond = 0; pig.kfav = false; pig.khate = false;
  const bios = BIOS[phenotype(pig).caractere]; pig.bio = pick(rng, bios);
  return pig;
}
// Deux cochons de départ : visuellement distincts, poils « faciles à lire ».
function makeStarters(rng) {
  const cols = shuffle(rng, ['noir', 'chocolat', 'roux', 'creme', 'lilas', 'blanc']);
  const mot = shuffle(rng, ['bicolore', 'agouti', 'roan', 'uni', 'tricolore']);
  const poils = shuffle(rng, ['court', 'abyssin', 'teddy']);
  const car = shuffle(rng, GENES.caractere.keys);
  const a = makePig(rng, { couleur: cols[0], motif: mot[0], poil: poils[0], caractere: car[0] }, []);
  const b = makePig(rng, { couleur: cols[1], motif: mot[1], poil: poils[1], caractere: car[1] }, [a.name]);
  a.born = -Math.floor(12 + rng() * 10); b.born = -Math.floor(12 + rng() * 10);
  return [a, b];
}

const phenoKeys = pig => { const p = phenotype(pig); return [p.couleur, p.motif, p.poil, p.caractere]; };
// Un cochon « de souvenir » (parent parti, carte postale) : même apparence, gènes doublés.
function ghostPig(keys, seed, age) {
  const genes = {}; GENE_ORDER.forEach((g, i) => { genes[g] = [keys[i], keys[i]]; });
  return { id: 'g', seed: seed >>> 0 || 1, genes: genes, age: age || 'adulte', born: 0, name: '', quirks: [], known: [] };
}
function parentRec(p) { return { id: p.id, n: p.name, k: phenoKeys(p), g: p.par ? [p.par[0].n, p.par[1].n] : null }; }
function crossPig(rng, A, B, day, usedNames) {
  const pig = { id: 'p' + Date.now().toString(36) + (++_pigCounter) + Math.floor(rng() * 1296).toString(36), seed: (Math.floor(rng() * 4294967295) >>> 0) || 1, genes: {}, age: 'bebe', born: day, nn: true, par: [parentRec(A), parentRec(B)], kh: {} };
  for (const g of GENE_ORDER) {
    const x = A.genes[g][rng() < 0.5 ? 0 : 1], y = B.genes[g][rng() < 0.5 ? 0 : 1], dom = GENES[g].dom;
    pig.genes[g] = dom[x] >= dom[y] ? [x, y] : [y, x];
  }
  const pool = NAMES.filter(n => !(usedNames && usedNames.indexOf(n) >= 0));
  pig.name = pick(rng, pool.length ? pool : NAMES);
  const qp = shuffle(rng, A.quirks.concat(B.quirks).filter(k => QUIRK_LIVE.indexOf(k) >= 0)), qs = [];
  for (let i = 0; i < 2; i++) {
    let k = (qp.length && rng() < 0.6) ? qp.shift() : pick(rng, QUIRK_LIVE);
    for (let t = 0; t < 8 && qs.indexOf(k) >= 0; t++) k = pick(rng, QUIRK_LIVE);
    qs.push(k);
  }
  pig.quirks = qs; pig.known = [];
  const vv = shuffle(rng, VEG), fp = pick(rng, [A.fav, B.fav]); pig.fav = (rng() < 0.5 && VEG.indexOf(fp) >= 0) ? fp : vv[0];
  pig.hate = vv.find(v => v !== pig.fav) || 'endive'; pig.bond = 0; pig.kfav = false; pig.khate = false;
  pig.bio = pick(rng, BIOS[phenotype(pig).caractere]);
  return pig;
}
// Nombre de petits : de 1 à 4, le plus souvent 2 ou 3.
const LITTER_W = { 1: 18, 2: 38, 3: 30, 4: 14 };
// Chaque parent dont un gène caché vient de s'exprimer chez un petit le « révèle » (jamais deviné à l'avance).
function revealCarriers(parents, pups) {
  const out = [];
  for (const pup of pups) for (const g of GENE_ORDER) {
    const e = expressed(pup, g);
    for (const P of parents) {
      if (expressed(P, g) === e || P.genes[g].indexOf(e) < 0) continue;
      P.kh = P.kh || {};
      if (P.kh[g] !== e) { P.kh[g] = e; out.push({ pig: P.name, g: g, a: e }); }
    }
  }
  return out;
}
// Ce que le vétérinaire sait dire d'un couple : conseil + raison, sans jamais interdire.
function vetAdvice(A, B) {
  const a = phenotype(A), b = phenotype(B);
  if (a.motif === 'roan' && b.motif === 'roan') return { bad: true, small: true, t: 'Deux roans ensemble : la portée sera plus petite, un ou deux petits. Un autre motif en donnerait davantage.' };
  if (a.motif === 'dalmatien' && b.motif === 'dalmatien') return { bad: true, small: true, t: 'Deux dalmatiens ensemble : la portée sera plus petite, un ou deux petits. Un autre motif en donnerait davantage.' };
  if (a.poil === 'skinny' && b.poil === 'skinny') return { bad: false, t: 'Deux skinnys : tout ira bien, mais ils auront besoin de chaleur. Rien d’inquiétant.' };
  const same = GENE_ORDER.filter(g => a[g] === b[g]).length;
  if (same >= 3) return { bad: false, t: 'Ils se ressemblent beaucoup : les petits aussi. Un couple plus différent réserve plus de surprises.' };
  if (same === 0) return { bad: false, t: 'Ils sont très différents : tout peut arriver. Observez bien les petits !' };
  return { bad: false, t: 'Un beau couple, en bonne santé. Je ne vois aucun souci.' };
}
// Probabilités d'apparence pour chaque trait (mode curieux : le « tableau » de croisement).
function crossOdds(A, B, g) {
  const dom = GENES[g].dom, out = {};
  for (const x of A.genes[g]) for (const y of B.genes[g]) { const e = dom[x] >= dom[y] ? x : y; out[e] = (out[e] || 0) + 0.25; }
  return out;
}

// Repères pour les autres modules (adulte tourné vers la droite, distances depuis le point au sol)

// ---- spécification de motif, propre à chaque cochon (graine) ----
function patternSpec(pig, phen) {
  const rng = mulberry32((pig.seed | 0) ^ 0x51ed270b);
  const main = phen.couleur;
  const ca = pig.genes.couleur;
  const hid = ca[0] === main ? ca[1] : ca[0];

const NAV = { C: 8, W: 22, H: 40 };

// Ombre « dans la palette » sous un cochon, un papillon…
function groundShadow(ctx, world, cx, cy, rx, ry) {
  const W = G.W, H = G.H;
  for (let y = Math.max(0, Math.floor(cy - ry)); y <= Math.min(H - 1, Math.ceil(cy + ry)); y++)
    for (let x = Math.max(0, Math.floor(cx - rx)); x <= Math.min(W - 1, Math.ceil(cx + rx)); x++) {
      const d = Math.hypot((x + 0.5 - cx) / rx, (y + 0.5 - cy) / ry); if (d > 1) continue;

      ctx.fillStyle = PAL_HEX[SHADE[world.gidx[y * W + x]]]; ctx.fillRect(x, y, 1, 1);
    }
}

const BFLY = {
  list: [],
  init(world, rng) {

  update(dt, world, rng) {

   - « wheek » (sifflement montant) : fondamentale de ~0,7 kHz qui monte vers ~3 kHz, 0,3-0,5 s, harmoniques ;
   - ronronnement : fondamentale 0,27-0,4 kHz, impulsions d'environ 50 ms à 13-18 Hz ;

      const c = this.ctx, t0 = c.currentTime + (o.delay || 0), dur = o.dur, out = this.dest(o.x);
      const osc = c.createOscillator(); osc.type = 'sawtooth';

  // paramètres de voix stables, dérivés de l'identifiant du cochon

  // « wheek » : sifflement qui monte vers 2-3 kHz, souvent doublé

  // ronronnement : fondamentale grave, impulsions de ~50 ms à 13-18 Hz

  // « chut » : deux ou trois impulsions graves
  chut(pig, x) {

  squeak(x) { this.voice({ x: x, dur: 0.11, vol: 0.04, att: 0.012, hold: 0.5, pts: [[0, 1050], [1, 1900]], res: 1900, breath: 0.2 }); },
  // pas sur l'herbe, impact de pattes
  step(x, k) { this.nz({ x: x, f: 700, q: 0.7, type: 'lowpass', dur: 0.04, vol: 0.04 * (k || 1) }); this.nz({ x: x, f: 3200, q: 0.8, type: 'highpass', dur: 0.05, vol: 0.01 * (k || 1) }); },

  munch(x) {

      const d = k * (0.105 + Math.random() * 0.025);

      for (let j = 0; j < 3; j++) this.nz({ x: x, delay: d + Math.random() * 0.045, f: 4200 + Math.random() * 2500, q: 1.4, type: 'highpass', dur: 0.009, vol: 0.05, att: 0.001 });

  // boire : coups de langue, glouglou, et le « tink » de la bille du biberon
  sip(x) {
    if (!this.can()) return;

      const d = k * 0.11 + Math.random() * 0.02;
      this.nz({ x: x, delay: d, f: 2800 + Math.random() * 800, q: 3.5, dur: 0.035, vol: 0.05 });

    }
    this.tone({ f0: 2400, dur: 0.14, vol: 0.016, delay: 0.03 }); this.tone({ f0: 3720, dur: 0.1, vol: 0.008, delay: 0.03 });
  },
  // --- soins : bulle, foin, légume, brosse, balai, balle, cœurs ---
  bloop(x) { this.tone({ f0: 660, f1: 990, dur: 0.09, vol: 0.05, type: 'sine' }); this.tone({ f0: 1320, dur: 0.08, vol: 0.025, delay: 0.06 }); },
  rustle(x) { for (let i = 0; i < 8; i++) this.nz({ x: x, delay: i * 0.045 + Math.random() * 0.03, f: 3200 + Math.random() * 2800, q: 0.8, dur: 0.04, vol: 0.05 }); },
  crunch(x) {
    if (!this.can()) return;

    this.tone({ f0: 170, f1: 95, dur: 0.07, vol: 0.05 });
    this.nz({ x: x, delay: 0.1, f: 2300, q: 1.1, dur: 0.06, vol: 0.1 }); this.nz({ x: x, delay: 0.115, f: 5500, q: 1.2, type: 'highpass', dur: 0.02, vol: 0.05 });
  },
  swish(x) { this.nz({ x: x, f: 3800, q: 0.6, dur: 0.13, vol: 0.04, att: 0.04 }); this.nz({ x: x, f: 6500, type: 'highpass', dur: 0.1, vol: 0.012, att: 0.03 }); },
  fur(x) { this.nz({ x: x, f: 900, q: 0.5, type: 'lowpass', dur: 0.16, vol: 0.035, att: 0.05 }); },
  sweep(x) { this.nz({ x: x, f: 1400, q: 0.5, dur: 0.2, vol: 0.05, att: 0.07 }); this.nz({ x: x, f: 3000, type: 'highpass', dur: 0.1, vol: 0.014, att: 0.04 }); },
  ploc(x) { this.tone({ f0: 700 + Math.random() * 90, f1: 360, dur: 0.05, vol: 0.03 }); },
  bounce(x, k) { k = k || 1; this.tone({ f0: 340, f1: 170, dur: 0.1, vol: 0.055 * k, type: 'triangle' }); this.nz({ x: x, f: 600, q: 0.7, type: 'lowpass', dur: 0.05, vol: 0.03 * k }); },
  boude(pig, x) { this.nz({ x: x, f: 1200, q: 0.6, dur: 0.32, vol: 0.05, att: 0.05 }); const v = this.pv(pig); this.voice({ x: x, delay: 0.05, dur: 0.18, vol: 0.03, att: 0.02, hold: 0.4, pts: [[0, v.f0 * 0.7], [1, v.f0 * 0.5]], res: 900, breath: 0.5, lp: 3000 }); },
  tink(n) { const f = this.freq(n, 0); this.tone({ f0: f, dur: 0.16, vol: 0.045, att: 0.004 }); this.tone({ f0: f * 2, dur: 0.08, vol: 0.015 }); },
  combo(n) { this.note(n + 2, 0.8, 0, 0); this.note(n + 4, 0.7, 0.07, 0); },
  fanfare() { [0, 2, 4, 7, 9, 12].forEach((s, i) => this.note(s + 1, 0.8, i * 0.09, 0)); },
  // oiseaux : trois « espèces » de phrases, loin et à gauche ou à droite
  birdNote(f0, f1, dur, delay, x, vol) {
    if (!this.can()) return;
    try {
      const c = this.ctx, t0 = c.currentTime + delay, o = c.createOscillator(), g = c.createGain(), lp = c.createBiquadFilter();

      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + dur * 0.2); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    if (kind === 0) { const n = 3 + ((Math.random() * 3) | 0); for (let i = 0; i < n; i++) this.birdNote(b * (1 + 0.03 * i), b * 0.78 * (1 + 0.03 * i), 0.06, i * 0.1, x, v); }

  // --- sons d'interface (notes douces, pas des cris d'animaux) ---
  freq(step, oct) { return 523.25 * Math.pow(2, (this.PENTA[((step % 10) + 10) % 10] + 12 * (oct || 0)) / 12); },
  note(step, vol, delay, oct) { const f = this.freq(step, oct || -1); this.tone({ f0: f, dur: 0.46, vol: 0.12 * (vol || 1), att: 0.006, delay: delay }); this.tone({ f0: f * 2, dur: 0.2, vol: 0.03 * (vol || 1), delay: delay }); },
  pop() { this.tone({ f0: 520, f1: 830, dur: 0.08, vol: 0.07 }); },
  back() { this.tone({ f0: 640, f1: 400, dur: 0.09, vol: 0.06 }); },
  chime() { [0, 2, 4, 7].forEach((s, i) => this.note(s + 2, 0.9, i * 0.1, 0)); },
  // --- étape 3 : jour, potager, marché, courrier ---
  cricket() { // grillons du soir : deux petits groupes de trois pulsations, au loin

    const out = this.dest(Math.random() * 176), f = 4200 + Math.random() * 500;
    for (let g = 0; g < 2; g++) for (let i = 0; i < 3; i++) this.tone({ f0: f, dur: 0.04, vol: 0.016, att: 0.006, delay: g * 0.34 + i * 0.065, out: out });
  },
  phase(n) { // passage d'un moment du jour à l'autre
    if (n === 0) [0, 2, 4].forEach((s, i) => this.note(s + 4, 0.55, i * 0.11, 0));
    else if (n === 1) [2, 4, 7].forEach((s, i) => this.note(s + 3, 0.6, i * 0.1, 0));

  },
  plant(x) { this.nz({ x: x, f: 520, q: 0.6, type: 'lowpass', dur: 0.14, vol: 0.05, att: 0.02 }); this.ploc(x); },
  water(x) {
    this.nz({ x: x, f: 3600, q: 0.5, type: 'highpass', dur: 0.5, vol: 0.02, att: 0.12 });
    for (let i = 0; i < 4; i++) this.tone({ f0: 1500 + Math.random() * 500, f1: 800, dur: 0.05, vol: 0.012, delay: 0.1 + i * 0.1 + Math.random() * 0.05 });
  },
  harvest(x) { this.crunch(x); this.tone({ f0: 880, dur: 0.12, vol: 0.04, delay: 0.05 }); this.tone({ f0: 1320, dur: 0.14, vol: 0.03, delay: 0.12 }); },
  buy() { this.note(5, 0.8, 0, 0); this.note(9, 0.8, 0.09, 0); this.tone({ f0: 2600, dur: 0.1, vol: 0.02, delay: 0.16 }); },
  place(x) { this.tone({ f0: 190, f1: 90, dur: 0.12, vol: 0.07, type: 'triangle' }); this.nz({ x: x, f: 800, q: 0.7, type: 'lowpass', dur: 0.07, vol: 0.04 }); },
  paper() { for (let i = 0; i < 3; i++) this.nz({ f: 5200 + i * 600, q: 0.7, type: 'highpass', dur: 0.07, vol: 0.02, delay: i * 0.05, att: 0.01 }); },
  shutter() { this.nz({ f: 3800, q: 0.9, type: 'highpass', dur: 0.03, vol: 0.08 }); this.nz({ f: 2200, q: 1.1, type: 'bandpass', dur: 0.045, vol: 0.07, delay: 0.055 }); this.tone({ f0: 1400, f1: 900, dur: 0.05, vol: 0.02, delay: 0.055 }); },
  deny() { this.tone({ f0: 270, f1: 200, dur: 0.11, vol: 0.05, type: 'triangle' }); },
  tick(dt) {
    const ph = (GAME.state && GAME.state.phase) | 0; this.birdT -= dt;
    if (this.birdT > 0) return;
    const k = Access.calm ? 1.6 : 1; // mode calme : oiseaux et grillons plus rares
    if (!Access.amb) { this.birdT = 4; return; }
    if (ph === 2) { this.birdT = (2 + Math.random() * 4) * k; this.cricket(); }
    else { this.birdT = (ph === 0 ? 3.5 + Math.random() * 7 : 6 + Math.random() * 10) * k; this.chirp(); }
  }
};

/* ==== 08 · vie des cochons : déplacements, activités, humeurs et manies ==== */
// Poids d'activités selon le caractère (tout est piloté par cette table).
const CHAR_W = {
  timide:   { wander: 3, rest: 5, eat: 4, drink: 2, sniff: 2, popcorn: 0.5, look: 2, fence: 1, greet: 1 },
  curieux:  { wander: 6, rest: 2, eat: 3, drink: 2, sniff: 5, popcorn: 1.3, look: 5, fence: 3, greet: 3 },
  gourmand: { wander: 3, rest: 3, eat: 9, drink: 2, sniff: 2, popcorn: 1.6, look: 1, fence: 1, greet: 1 },
  calin:    { wander: 3, rest: 4, eat: 3, drink: 2, sniff: 2, popcorn: 1.1, look: 2, fence: 1, greet: 8 },
  sportif:  { wander: 6, rest: 1, eat: 3, drink: 3, sniff: 1, popcorn: 5, look: 1, fence: 1, greet: 2 },
  bavard:   { wander: 4, rest: 2, eat: 3, drink: 2, sniff: 2, popcorn: 1.6, look: 3, fence: 1, greet: 5 }
};
const CHAR_SPD = { timide: 17, curieux: 22, gourmand: 19, calin: 20, sportif: 30, bavard: 22 };
const AGE_SPD = { bebe: 0.78, jeune: 0.95, adulte: 1, senior: 0.68 };   // les petits trottinent, les sages prennent leur temps
const hasQ = (e, k) => e.pig.quirks.indexOf(k) >= 0;

function makeEnt(pig, x, y, face) {
  const ch = phenotype(pig).caractere, rng = mulberry32(hash32(pig.id) ^ (pig.seed | 0));
  return { pig: pig, id: pig.id, char: ch, x: x, y: y, face: face || 1, st: 'idle', t: 0, dur: 0.5 + rng() * 1.2, path: [], pi: 0, then: null, pose: 'stand', f: 0, ft: 0,
    hopY: 0, rng: rng, spd: CHAR_SPD[ch] || 22, done: {}, lastAct: '', say: ch === 'bavard' ? 5 + rng() * 4 : 14 + rng() * 14, crab: 0, wait: 0, nt: 0, zt: 0,
    flips: 0, hops: 0, hopIdx: -1, pcn: 0, crabSeen: 0, lookAt: null, spot: null, other: null,
    clock: rng() * 20, bp: 3 + rng() * 3.5, fp: 8 + rng() * 6, ph2: rng() };
}
function entSet(e, st, dur, extra) { e.st = st; e.t = 0; e.dur = dur; if (extra) for (const k in extra) e[k] = extra[k]; e.st = st; e.dur = dur; }
function otherEnts(e, env) { return env.ents.filter(o => o !== e); }
function entById(env, id) { return env.ents.find(o => o.id === id); }

function entGo(e, env, tx, ty, then) {
  e.path = astar(env.world.nav, e.x, e.y, tx, ty); e.pi = 0; e.then = then; e.st = 'walk'; e.t = 0; e.wait = 0; e.dur = 99;
}
function entArrive(e, env) {
  const th = e.then || { st: 'idle', dur: 1.2 }; e.then = null; e.path = [];
  if (th.face) e.face = th.face;
  entSet(e, th.st, th.dur != null ? th.dur : 2, th);
  entEnter(e, env);
}
function entEnter(e, env) {
  const T = env.time;
  switch (e.st) {
    case 'eat': e.nt = 0.9; e.done.eat = T; break;
    case 'drink': e.nt = 0.3; e.done.drink = T; break;
    case 'sniff': e.nt = 0.4; e.done.sniff = T; break;
    case 'nibble': e.done.fence = T; break;
    case 'turn3': e.flips = 0; break;
    case 'sleep': e.zt = 0.6; e.done.rest = T; break;
    case 'popcorn': e.hopIdx = -1; e.done.popcorn = T; break;
    case 'corner': e.nt = 0.7; e.done.corner = T; break;
    case 'greet': {
      e.done.greet = T; e.nt = 0.2;
      const o = entById(env, e.other);
      if (!o || Math.hypot(o.x - e.x, o.y - e.y) > 34 || ['sleep', 'eat', 'drink', 'popcorn', 'turn3', 'nibble', 'care'].indexOf(o.st) >= 0) { entSet(e, 'idle', 0.6); break; }
      if (o.st !== 'greet') { o.path = []; o.then = null; entSet(o, 'greet', e.dur, { face: -e.face, other: e.id }); o.nt = 0.5; o.done.greet = T; }
      if (e.char === 'bavard' || o.char === 'bavard') FX.wave(e.x + e.face * 18, e.y - 9, e.face);
      AUD.chut(e.pig, e.x);
      break;
    }
  }
}

function pickSpot(e, env, list) {
  const free = list.filter(s => env.ents.every(o => o === e || (Math.hypot(o.x - s.x, o.y - s.y) > 16 && !(o.spot === s && o.st !== 'idle'))));
  return free.length ? pick(e.rng, free) : null;
}
function nearestButterfly(e, r) {
  let best = null, bd = r;
  for (const b of BFLY.list) { const d = Math.hypot(b.x - e.x, b.y - e.y); if (d < bd) { bd = d; best = b; } }

    const f = e.face, b = { x: e.x + f * 19, y: e.y + 1, vx: f * 62, vy: (e.rng() - 0.5) * 50, z: 0, vz: 70, o: e, hits: 0, cool: 0.5, t: 0, f: 0 };
    const W = GAME.world; if (navBlockedAt(W.nav, b.x, b.y)) { b.x = e.x; b.y = e.y + 2; }
    this.ball = b; this.enter(e, { kind: 'play', t: 0, ball: b, path: null, rp: 0 }); AUD.pop(); AUD.bounce(b.x, 1);
  },
  openTray(e) {
    const st = GAME.state, pig = e.pig, rng = mulberry32((hash32(pig.id) ^ ((G.time * 1000) | 0)) >>> 0), pool = VEG.slice(), opts = [];
    const take = v => { const i = pool.indexOf(v); if (i >= 0) { pool.splice(i, 1); opts.push(v); } };
    if (rng() < (pig.kfav ? 0.55 : 0.5)) take(pig.fav);
    if (!pig.khate ? rng() < 0.4 : rng() < 0.25) take(pig.hate);
    while (opts.length < 3 && pool.length) opts.push(pool.splice(Math.floor(rng() * pool.length), 1)[0]);
    // ordre mélangé
    for (let i = opts.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = opts[i]; opts[i] = opts[j]; opts[j] = t; }
    this.tray = { e: e, opts: opts.slice(0, 3), t: 0 };

  },
  closeTray() { const t = this.tray; this.tray = null; if (t && t.e.cp && t.e.cp.kind === 'wait') { t.e.cp = null; entSet(t.e, 'idle', 0.4); } AUD.back(); },
  pickVeg(e, v, row) {
    const tr = this.tray; this.tray = null;

    this.enter(e, { kind: 'veg', t: 0, v: v, vk: kind, bites: 0, from: row ? { x: row.x + 8, y: row.y + 8 } : { x: e.x, y: e.y - 40 }, react: false });
    AUD.pop();
  },
  stroke(e, k, x, y, hold) {
    const nd = e.nd;

    e.cp.t = 0; e.cp.happy = true; e.cp.closed = k !== 'brossage'; // le cochon garde son sens : il ne suit pas le doigt

    if (k === 'brossage') { AUD.swish(e.x); FX.fur(x, y, e.pig); if (e.cp.n % 2 === 0) FX.spark(e.x + e.face * 4, e.y - 12); }
    else { AUD.fur(e.x); if (e.cp.n === 7 && e.rng() < (e.char === 'calin' ? 0.55 : 0.15)) AUD.purr(e.pig, 0.9, 0.05, e.x); if (e.cp.n % 3 === 0) FX.heart(e.x + (Math.random() - 0.5) * 10, e.y - 18); }

  },
  sweepAt(x, y) {
    const p = this.pend; if (!p || !p.e || !p.e.nd) return;
    const e = p.e, mine = this.pellets.filter(q => q.o === e && q.on);
    let hit = 0;
    for (const q of mine) if (Math.hypot(q.x - x, q.y - y) < 9) { q.dead = true; hit++; FX.puff(q.x, q.y); }
    if (!hit) return;
    this.pellets = this.pellets.filter(q => !q.dead);
    AUD.sweep(x);
    const left = this.pellets.filter(q => q.o === e).length;
    e.nd.prog = 1 - left / 5;
    if (left === 0) {
      this.pend = null; this.drag = null; this.swallow = true;

      FX.heart(e.x, e.y - 20);

  },

  // ---------- entrées ----------
  inBox(b, x, y, m) { m = m || 0; return x >= b.x - m && x < b.x + b.w + m && y >= b.y - m && y < b.y + b.h + m; },
  over(e, x, y) { const fx = (x - e.x) * e.face; return fx >= -19 && fx <= 25 && y >= e.y - 25 && y <= e.y + 9; },
  active() { return GAME.playing && UI.screen === 'play' && !UI.card && !UI.settings && !UI.modal() && !this.fade; },
  press(x, y) {
    this.pend = null; this.drag = null; this.swallow = false; this.ptr = { x: x, y: y };
    if (UI.place) return y >= HUD_H && y < BAR_Y ? Deco.press(x, y) : false; // pose d'un objet : le doigt le fait glisser
    if (UI.photo) return y >= HUD_H && y < BAR_Y ? Photo.press(x, y) : false; // viseur : le doigt déplace le cadre
    if (!this.active() || y < HUD_H || y >= BAR_Y || UI.toastAt(x, y)) return false;
    if (this.tray) {
      const g = this.trayGeom(), i = g.rows.findIndex(r => this.inBox(r, x, y));
      this.pend = i >= 0 ? { kind: 'veg', e: this.tray.e, v: this.tray.opts[i], row: g.rows[i] } : { kind: 'trayclose' }; return true;
    }
    for (const e of GAME.ents) if (this.bubbleShown(e)) { const b = this.bubbleBox(e); if (this.inBox(b, x, y, 4)) { this.pend = { kind: 'bubble', e: e }; return true; } }
    for (const e of GAME.ents) {
      if (!e.nd || e.nd.k !== 'litiere') continue;
      const mine = this.pellets.filter(q => q.o === e && q.on);
      if (mine.some(q => Math.hypot(q.x - x, q.y - y) < 14)) { this.pend = { kind: 'sweep', e: e, x0: x, y0: y, lx: x, ly: y, moved: false }; return true; }
    }
    const cand = GAME.ents.filter(e => entHit(e, x, y) && e.st !== 'sleep').sort((a, b) => b.y - a.y)[0];
    if (cand) { this.pend = { kind: 'stroke', e: cand, x0: x, y0: y, lx: x, ly: y, moved: false, acc: 0, held: 0 }; return false; } // le toucher simple ouvrira la fiche
    return false;
  },
  move(x, y) {
    this.ptr = { x: x, y: y }; if (UI.place) { Deco.move(x, y); return; } if (UI.photo) { Photo.move(x, y); return; } const p = this.pend; if (!p || !this.active()) return;
    if (p.kind === 'stroke') {
      const e = p.e, k = e.nd && NEEDS[e.nd.k].kind === 'stroke' ? e.nd.k : null;
      if (!p.moved && Math.hypot(x - p.x0, y - p.y0) > 4) { p.moved = true; this.freeze(e); }
      if (p.moved) {
        this.drag = { x: x, y: y, tool: k ? NEEDS[k].tool : 'hand' };
        if (this.over(e, x, y)) { p.acc += Math.hypot(x - p.lx, y - p.ly); while (p.acc >= 13) { p.acc -= 13; this.stroke(e, k, x, y); if (!this.pend) return; } }
        p.lx = x; p.ly = y;
      }
    } else if (p.kind === 'sweep') {
      if (!p.moved && Math.hypot(x - p.x0, y - p.y0) > 3) p.moved = true;
      if (p.moved) { this.drag = { x: x, y: y, tool: 'broom' }; const n = Math.max(1, Math.ceil(Math.hypot(x - p.lx, y - p.ly) / 4)); for (let i = 1; i <= n; i++) { this.sweepAt(p.lx + (x - p.lx) * i / n, p.ly + (y - p.ly) * i / n); if (!this.pend) break; } if (this.pend) { p.lx = x; p.ly = y; } }
    }
  },
  release(x, y) { // vrai = le geste a été traité ici, l'interface n'a rien à faire
    if (UI.place && UI.place.drag) return Deco.release(x, y);
    if (UI.photo && UI.photo.grab) return Photo.release(x, y);
    const p = this.pend; this.pend = null; this.drag = null;
    if (!p) { const w = this.swallow; this.swallow = false; return w; }
    switch (p.kind) {
      case 'trayclose': this.closeTray(); return true;
      case 'veg': { const g = this.trayGeom(), r = g.rows.find(z => z.v === p.v); if (r && this.inBox(r, x, y)) { this.pickVeg(p.e, p.v, r); return true; } this.closeTray(); return true; }
      case 'bubble': { if (this.bubbleShown(p.e) && this.inBox(this.bubbleBox(p.e), x, y, 6)) this.tapBubble(p.e); return true; }
      case 'sweep': if (!p.moved) { p.e.nd && (p.e.nd.pulse = 1.8); AUD.pop(); UI.toast('Une bulle !', NEEDS.litiere.hint, 'info'); } return true;
      case 'stroke': return !!(p.moved || p.holding);
    }
    return false;
  },

  // ---------- l'état « soin » des cochons (appelé par entUpdate) ----------
  entUpdate(e, dt, env) {
    const cp = e.cp; if (!cp) { entSet(e, 'idle', 0.5); return; }
    cp.t += dt;
    const mx = e.x + e.face * 17;
    switch (cp.kind) {
      case 'hold': { // immobile, attentif ou ravi
        e.pose = 'stand'; e.f = cp.happy ? 2 : (((cp.t / 1.1) | 0) & 1);
        if (cp.happy && cp.closed) { e.nt -= dt; if (e.nt <= 0) { e.nt = 0.7; } }
        if (cp.t >= (cp.dur || 2)) { e.cp = null; entSet(e, 'idle', 0.6 + e.rng()); }
        break;
      }
      case 'wait': e.pose = 'curious'; e.f = 0; break;
      case 'hay': {
        const T = cp.t;
        if (T < 0.4) { e.pose = 'curious'; e.f = 0; }
        else {
          e.pose = 'eat'; const pf = e.f; e.f = (((T - 0.4) / 0.42) | 0) & 1;
          if (e.f !== pf && e.f === 1) { AUD.munch(e.x); if (e.rng() < 0.8) FX.crumbs(mx, e.y - 3, 2, [17, 29, 16]); if (e.rng() < 0.4) AUD.rustle(e.x); }
        }
        if (T > 3.4) { this.hays = this.hays.filter(h => h !== cp.hay); FX.puff(cp.hay.x, cp.hay.y); this.complete(e, 'foin'); }
        break;
      }
      case 'veg': this.vegStep(e, cp, env, mx); break;
      case 'play': this.playStep(e, cp, dt, env); break;
      default: e.cp = null; entSet(e, 'idle', 0.5);
    }
  },
  vegStep(e, cp, env, mx) {
    const T = cp.t, pig = e.pig, nm = pig.name;
    if (T < 0.35) { e.pose = 'curious'; e.f = 0; return; }
    if (cp.vk === 'hate') {
      if (T < 1.0) {
        e.pose = 'eat'; e.f = (((T - 0.35) / 0.3) | 0) & 1;
        if (cp.bites < 1 && T >= 0.55) { cp.bites = 1; AUD.crunch(e.x); FX.crumbs(mx, e.y - 3, 3, VEG_CRUMB[cp.v]); }
        return;
      }
      if (!cp.react) {
        cp.react = true; cp.bites = 3; e.face = -e.face; AUD.boude(pig, e.x); FX.puff(mx, e.y - 4);
        if (!pig.khate) { pig.khate = true; Save.dirty(); UI.toast('Pas fan…', nm + ' n’aime pas trop ' + VEG_ART[cp.v] + '.', 'info'); }
      }
      e.pose = 'stand'; e.f = 0;
      if (cp.t > 2.7) { this.sulk(e); this.complete(e, 'legume', { bad: true }); }
      return;
    }
    e.pose = 'eat'; e.f = (((T - 0.35) / 0.34) | 0) & 1;
    const nb = Math.min(3, 1 + (((T - 0.35) / 0.5) | 0));
    if (nb > cp.bites && !cp.react) { cp.bites = nb; AUD.crunch(e.x); FX.crumbs(mx, e.y - 3, 3, VEG_CRUMB[cp.v]); }
    if (T > 2.0) {
      if (!cp.react) {
        cp.react = true; cp.bites = 3;
        if (cp.vk === 'fav') {
          AUD.wheek(pig, 1, e.x); for (let i = 0; i < 4; i++) FX.heart(e.x + (i - 1.5) * 6, e.y - 16 - (i % 2) * 4);
          if (!pig.kfav) { pig.kfav = true; Save.dirty(); UI.toast('Coup de cœur !', nm + ' adore ' + VEG_ART[cp.v] + ' !', 'info'); AUD.chime(); }
        } else { AUD.purr(pig, 0.9, 0.05, e.x); FX.heart(e.x, e.y - 20); }
      }
      e.pose = 'stand'; e.f = 2;
      if (T > 2.9) { const fav = cp.vk === 'fav'; this.complete(e, 'legume', { fav: fav }); if (fav) { entSet(e, 'popcorn', 12, { hops: 2, drx: 0, dry: 0 }); entEnter(e, env); } }
    }
  },
  playStep(e, cp, dt, env) {
    const b = cp.ball, W = env.world;
    if (this.ball !== b) { e.cp = null; entSet(e, 'idle', 0.5); return; }
    cp.cool = (cp.cool || 0) - dt;
    const dx = b.x - e.x, dy = b.y - e.y, d = Math.hypot(dx, dy), still = Math.hypot(b.vx, b.vy) < 10 && b.z < 1;
    if (cp.nudge > 0) { cp.nudge -= dt; e.pose = 'eat'; e.f = 1; return; }
    if (b.hits >= 3 && (still || cp.t > 11)) { this.finishPlay(e, b, env); return; }
    if (cp.t > 13) { this.finishPlay(e, b, env); return; }
    if (b.hits >= 3) { e.pose = 'curious'; e.f = 0; if (Math.abs(dx) > 1) e.face = dx > 0 ? 1 : -1; return; }
    if (d < 17 && cp.cool <= 0 && b.z < 5) { // petit coup de museau
      cp.nudge = 0.28; cp.cool = 0.8; b.hits++; e.face = dx >= 0 ? 1 : -1;
      const n = d || 1; b.vx = dx / n * 78 + e.face * 14; b.vy = dy / n * 52 + (e.rng() - 0.5) * 30; b.vz = 55; b.z = 0.2;
      AUD.bounce(b.x, 1); FX.puff(b.x, b.y); if (b.hits === 2) FX.heart(e.x, e.y - 20);
      return;
    }
    if (d < 17) { e.pose = 'stand'; e.f = 0; if (Math.abs(dx) > 1) e.face = dx > 0 ? 1 : -1; return; }
    // poursuite : en ligne droite si le chemin est dégagé, sinon par la grille de navigation
    let vx = 0, vy = 0; const sp = e.spd * 1.7 * dt;
    if (navLos(W.nav, e.x, e.y, b.x, b.y)) { vx = dx / d; vy = dy / d; cp.path = null; }
    else {
      cp.rp = (cp.rp || 0) - dt;
      if (!cp.path || cp.rp <= 0) { cp.path = astar(W.nav, e.x, e.y, b.x, b.y); cp.pi = 0; cp.rp = 0.5; }
      const wp = cp.path && cp.path[cp.pi];
      if (wp) { const wx = wp.x - e.x, wy = wp.y - e.y, wd = Math.hypot(wx, wy); if (wd < 3) cp.pi++; else { vx = wx / wd; vy = wy / wd; } }
    }
    const nx = e.x + vx * sp, ny = e.y + vy * sp;
    if (!navBlockedAt(W.nav, nx, ny)) { e.x = nx; e.y = ny; }
    if (Math.abs(vx) > 0.2) e.face = vx > 0 ? 1 : -1;
    e.ft += dt * e.spd * 1.7 / 2.6; e.pose = 'walk'; const pf = e.f; e.f = Math.floor(e.ft) & 3;
    if (e.f !== pf && (e.f & 1) === 0) AUD.step(e.x, 0.8 + e.rng() * 0.5);
  },
  finishPlay(e, b, env) {
    this.ball = null; FX.puff(b.x, b.y);
    this.complete(e, 'jeu', { fx: e.x, fy: e.y - 22 });
    if (!e.cp) { entSet(e, 'popcorn', 12, { hops: 2 + ((e.rng() * 2) | 0), drx: 0, dry: 0 }); entEnter(e, env); }
  },
  updateBall(dt, env) {
    const b = this.ball; if (!b) return; b.t += dt;
    const W = env.world; let nx = b.x + b.vx * dt, ny = b.y + b.vy * dt;
    if (navBlockedAt(W.nav, nx, b.y)) { b.vx = -b.vx * 0.6; nx = b.x; }
    if (navBlockedAt(W.nav, b.x, ny)) { b.vy = -b.vy * 0.6; ny = b.y; }
    b.x = nx; b.y = ny;
    const fr = Math.exp(-1.7 * dt); b.vx *= fr; b.vy *= fr;
    b.vz -= 230 * dt; b.z += b.vz * dt;
    if (b.z <= 0) { b.z = 0; if (b.vz < -25) { b.vz = -b.vz * 0.45; AUD.bounce(b.x, 0.5); } else b.vz = 0; }
    b.spin = (b.spin || 0) + Math.hypot(b.vx, b.vy) * dt; b.f = ((b.spin / 3) | 0) & 1;
  },

  stop() { // on range tout : la balle, le foin, les crottes, le plateau ; les besoins non faits restent notés jusqu'à la fin de la journée
    this.ball = null; this.hays = []; this.pellets = []; this.tray = null; this.pend = null; this.drag = null; this.chain = 0;
    GAME.ents.forEach(e => { e.nd = null; e.hopY = 0; if (e.st === 'care') { e.cp = null; entSet(e, 'idle', 0.8 + e.rng()); } });
  },

  // ---------- fin de journée (le temps n'avance que sur demande du joueur) ----------
  endDay() {
    const st = GAME.state, c = st.care; if (this.fade || !c) return;
    if (Season.contestDue(st) && !UI.contest) { UI.endArm = 0; this.pend = null; this.drag = null; if (this.tray) this.closeTray(); Season.openContest(); return; } // le soir du rendez-vous : on y va avant de dormir
    UI.endArm = 0; this.pend = null; this.drag = null; if (this.tray) this.closeTray();
    this.fade = { t: 0, did: false, recap: this.recap() }; AUD.chime();
  },
  recap() { // petit bilan de la journée qui s'achève, montré pendant le fondu
    const st = GAME.state, c = st.care || {}, parts = [];
    if (c.d) parts.push(c.d + (c.d > 1 ? ' soins' : ' soin'));
    const h = (st.hearts | 0) - (c.h0 | 0), t = (st.clover | 0) - (c.c0 | 0);
    if (h > 0) parts.push(h + (h > 1 ? ' cœurs' : ' cœur')); if (t > 0) parts.push(t + (t > 1 ? ' trèfles' : ' trèfle'));
    return parts.length ? 'Hier : ' + parts.join(', ') : 'Une journée tranquille';
  },
  updateFade(dt) {
    const f = this.fade; f.t += dt;
    if (!f.did && f.t >= 0.6) {
      f.did = true; const st = GAME.state;
      if (typeof Garden !== 'undefined') Garden.nextDay(st);
      st.day++; st.phase = 0; Life.dayStart(st); st.care = this.gen(st);
      if (Life.changed) GAME.rebuild(st); // des petits sont nés : le refuge se recompose pendant que l'écran est noir
      this.resetRuntime(false);
      if (typeof Mail !== 'undefined') Mail.sync(st);
      Time.setPhase(0, true); Save.dirty(); Save.flush();
      GAME.ents.forEach(e => { e.hopY = 0; if (e.st === 'care') { e.cp = null; entSet(e, 'idle', 1); } });
    }
    if (f.t >= 2.1) { this.fade = null; Life.afterFade(); }
  },

  // ---------- dessin ----------
  worldItems() {
    const out = [];
    for (const h of this.hays) out.push({ y: h.y, c: { t: 'hay', o: h } });
    for (const p of this.pellets) { if (!p.on && G.time >= p.t0) { p.on = true; AUD.ploc(p.x); } if (p.on) out.push({ y: p.y, c: { t: 'pel', o: p } }); }
    if (this.ball) out.push({ y: this.ball.y, c: { t: 'ball', o: this.ball } });
    for (const e of GAME.ents) if (e.st === 'care' && e.cp && e.cp.kind === 'veg' && e.cp.bites < 3 && !(e.cp.react && e.cp.vk === 'hate')) out.push({ y: e.y + 0.5, c: { t: 'veg', o: e } });
    return out;
  },
  drawItem(ctx, c) {
    const W = GAME.world, sp = CSP();
    switch (c.t) {
      case 'hay': { const h = c.o, k = Math.min(1, h.t / 0.3), yy = h.y - (1 - k) * 16; groundShadow(ctx, W, h.x, h.y, 7, 1.8); ctx.drawImage(sp.hay, Math.round(h.x - 7), Math.round(yy - 7)); break; }
      case 'pel': { const p = c.o; R(ctx, p.x, p.y, 3, 2, 13); P(ctx, p.x, p.y, 14); break; }
      case 'ball': { const b = c.o; groundShadow(ctx, W, b.x, b.y, 3.6 - Math.min(1.5, b.z * 0.06), 1.3); ctx.drawImage(sp.ball[b.f | 0], Math.round(b.x - 3.5), Math.round(b.y - 6 - b.z)); break; }
      case 'veg': {
        const e = c.o, cp = e.cp, spr = sp.veg[cp.v], k = Math.min(1, cp.t / 0.35), ke = k * k * (3 - 2 * k);
        const rx = e.x + e.face * 20, ry = e.y + 1 - 12, sw = 13 - cp.bites * 4;
        const fx = cp.from.x - 6, fy = cp.from.y - 6, ax = Math.round(fx + (rx - fx) * ke), ay = Math.round(fy + (ry - fy) * ke - Math.sin(Math.PI * ke) * 10);
        if (k < 1 || sw >= 13) ctx.drawImage(spr, ax, ay);
        else if (sw > 0) { if (e.face > 0) ctx.drawImage(spr, 13 - sw, 0, sw, 13, ax + 13 - sw, ay, sw, 13); else ctx.drawImage(spr, 0, 0, sw, 13, ax, ay, sw, 13); }
        break;
      }
    }
  },
  trayGeom() {
    const t = this.tray, e = t.e, w = 92, h = 56, b = this.bubbleBox(e) || { y: e.y - 37 };
    const x = clamp(Math.round(e.x - w / 2), 4, G.W - w - 4);
    let y = Math.round(Math.min(b.y, e.y - 24) - h - 3);
    if (y < HUD_H + 4) y = Math.round(e.y + 10);
    y = clamp(y, HUD_H + 4, BAR_Y - h - 4);
    return { x: x, y: y, w: w, h: h, rows: t.opts.map((v, i) => ({ x: x + 4, y: y + 4 + i * 16, w: w - 8, h: 16, v: v })) };
  },
  ring(ctx, cx, cy, rx, ry) {
    const ph = (G.time * 10) | 0;
    for (let a = 0; a < 28; a++) { const t = a / 28 * 6.2832; P(ctx, Math.round(cx + Math.cos(t) * rx), Math.round(cy + Math.sin(t) * ry), (a + ph) % 4 < 2 ? 27 : 7); }
  },
  drawBubble(ctx, e) {
    const nd = e.nd, b = this.bubbleBox(e), pop = Math.min(1, nd.age / 0.16), bob = nd.pulse > 0 ? 0 : Math.round(Math.sin(nd.age * 2.6 + e.ph2 * 6));
    const x = b.x, y = b.y + bob, out = nd.sulk ? 3 : 14, fill = nd.sulk ? 26 : 7, sp = CSP();
    if (pop < 1) { const w = 5 + Math.round(pop * 10), h = w, bx = b.cx - (w >> 1), by = b.cy - (h >> 1) + 1; R(ctx, bx, by, w, h, out); R(ctx, bx + 1, by + 1, w - 2, h - 2, fill); return; }
    R(ctx, x + 1, y, 13, 15, out); R(ctx, x, y + 1, 15, 13, out); R(ctx, x + 1, y + 1, 13, 13, fill);
    R(ctx, x + 5, y + 15, 5, 1, out); R(ctx, x + 6, y + 16, 3, 1, out); P(ctx, x + 7, y + 17, out); R(ctx, x + 6, y + 15, 3, 1, fill); P(ctx, x + 7, y + 16, fill);
    P(ctx, x + 1, y + 1, 29); P(ctx, x + 13, y + 1, out); // reflet de papier
    ctx.drawImage(sp.ico[NEEDS[nd.k].kind === 'stroke' && nd.k === 'calin' ? 'calin' : nd.k], x + 3, y + 3);
    if (nd.prog > 0 && (NEEDS[nd.k].kind === 'stroke' || NEEDS[nd.k].kind === 'sweep')) { // petits cœurs de progression
      for (let i = 0; i < 3; i++) { const on = nd.prog >= (i + 0.66) / 3; S(ctx, FXS.heart, x + 1 + i * 5, y - 7, { '#': on ? 28 : 3 }); }
    }
  },
  drawOverlay(ctx) {
    if (!GAME.playing) return;
    const sp = CSP();
    for (const e of GAME.ents) {
      if (e.nd && e.nd.pulse > 0 && this.bubbleShown(e)) {
        if (e.nd.k === 'litiere') { const pl = this.pellets.filter(p => p.o === e); if (pl.length) this.ring(ctx, pl.reduce((s, p) => s + p.x, 0) / pl.length + 1, pl[0].y + 1, 14, 6); }
        else this.ring(ctx, e.x + e.face * 3, e.y - 6, 25, 13);
      }
      if (e.nd && this.bubbleShown(e)) this.drawBubble(ctx, e);
      if (e.st === 'care' && e.cp && e.cp.kind === 'veg' && e.cp.react && e.cp.vk === 'hate') ctx.drawImage(sp.ico.boude, Math.round(e.x - 4), Math.round(e.y - 32));
    }
    if (this.tray) this.drawTray(ctx);
    if (this.drag) { const t = sp.tool[this.drag.tool], dxo = this.drag.tool === 'hand' ? -4 : -3; ctx.drawImage(t, Math.round(this.drag.x + dxo), Math.round(this.drag.y - t.height - 2)); }
    for (const f of this.fly) { if (f.t < 0 || f.cx == null) continue; const x = Math.round(f.cx), y = Math.round(f.cy); S(ctx, FXS.heart, x - 2, y - 2, { '#': 28 }); P(ctx, x - 1, y - 1, 24); }
  },
  drawTray(ctx) {
    const g = this.trayGeom(), sp = CSP();
    panel(ctx, g.x, g.y, g.w, g.h, { noRivets: true });
    g.rows.forEach((r, i) => {
      const pr = this.pend && this.pend.kind === 'veg' && this.pend.v === r.v;
      if (pr) R(ctx, r.x, r.y, r.w, r.h, 17);
      ctx.drawImage(sp.veg[r.v], r.x + 1, r.y + 2);
      FONT.draw(ctx, cap1(r.v), r.x + 17, r.y + 4, 13, 1);
      if (i < g.rows.length - 1) R(ctx, r.x + 2, r.y + 15, r.w - 4, 1, 17);
    });
  },
  drawFade(ctx) {
    const f = this.fade, t = f.t, lv = t < 0.6 ? t / 0.6 : t < 1.5 ? 1 : Math.max(0, 1 - (t - 1.5) / 0.6);
    this.dims = this.dims || [0.25, 0.5, 0.75, 1.01].map(th => bake(G.W, G.H, x => { x.fillStyle = PAL_HEX[0]; for (let y = 0; y < G.H; y++) for (let xx = 0; xx < G.W; xx++) if (bayer(xx, y) < th) x.fillRect(xx, y, 1, 1); }));
    const i = Math.min(3, Math.floor(lv * 4)); if (lv > 0.05) ctx.drawImage(this.dims[Math.max(0, i - (lv < 1 ? 0 : 0))], 0, 0);
    if (t > 0.55 && t < 1.7) { const day = GAME.state.day; bigText(ctx, 'Jour ' + day, 88, 128, 7, 1, 3); ctext(ctx, f.recap || '', 88, 166, 29, 1); ctext(ctx, 'Les soins du matin commencent', 88, 180, 26, 1); }
  },
  // les deux compteurs (trèfles à l'extrême droite, cœurs juste avant) et, le matin, la tournée en un coup d'œil
  drawClover(ctx, x, y, hi) {
    S(ctx, ['.##.##.', '#######', '.#####.', '#######', '.##.##.', '...s...', '...s...'], x, y, { '#': hi ? 27 : 11, s: 9 });
    P(ctx, x + 1, y + 1, hi ? 7 : 31); P(ctx, x + 5, y + 3, 10);
  },
  drawHud(ctx) {
    const st = GAME.state, c = st.care, ph = st.phase | 0;
    const nc = String(this.shownC | 0), wc = FONT.width(nc), xc = G.W - 5 - wc, pc = this.pulseC > 0;
    FONT.draw(ctx, nc, xc + 1, 5, 13, 1); FONT.draw(ctx, nc, xc, 4, pc ? 27 : 7, 1);
    this.drawClover(ctx, xc - 9, 4, pc);
    const nh = String(this.shown | 0), wh = FONT.width(nh), xh = xc - 9 - 6 - wh, pp = this.pulse > 0;
    FONT.draw(ctx, nh, xh + 1, 5, 13, 1); FONT.draw(ctx, nh, xh, 4, pp ? 27 : 7, 1);
    S(ctx, FXS.heart, xh - 8, 5, { '#': pp ? 27 : 28 }); P(ctx, xh - 7, 6, 24);
    this.tgt = { heart: { x: xh - 5, y: 8 }, clover: { x: xc - 6, y: 8 } }; this.hudLeft = xh - 12;
    if (ph !== 0 || !c || !c.n) return;
    const nn = Math.min(14, c.n), done = c.d, cw = this.chain >= 2 ? FONT.width('×' + this.chain) + 7 : 0, pw = nn * 6 + 4 + cw, px = ((G.W - pw) >> 1), py = BAR_Y - 13;
    R(ctx, px, py, pw, 9, 0); R(ctx, px + 1, py + 1, pw - 2, 7, 1);
    for (let i = 0; i < nn; i++) R(ctx, px + 3 + i * 6, py + 3, 4, 3, i < done ? 28 : 3);
    if (cw) { S(ctx, FXS.heart, px + nn * 6 + 4, py + 2, { '#': 27 }); FONT.draw(ctx, '×' + this.chain, px + nn * 6 + 10, py + 1, 27, 1); }
  }
};

/* ==== 12 · le jour : matin, journée, soir. Ambiance par filtre de couleurs dans la palette (aucune 33e couleur), lucioles ==== */
const Time = {
  ph: 0, k: 1, next: null, layers: {}, ff: null, t: 0,

  sync(st) { this.ph = st.phase | 0; this.k = 1; this.next = null; },
  phase() { return GAME.state ? GAME.state.phase | 0 : 0; },

  // Filtre de couleurs : chaque couleur de la palette est remplacée par sa voisine la plus proche une fois teintée.
  // Aucune 33e couleur, aucun tramage : un vrai « palette swap », propre et net. lv = 1..5 (intensité).
  tint(ph, c, s) {
    if (ph === 0) { // matin : lumière fraîche et un peu voilée, ombres relevées
      const l = 0.12 * s, m = 1 + 0.05 * s;
      return [c[0] * m * (1 - l) + 196 * l, c[1] * m * (1 - l) + 214 * l, c[2] * m * (1 - l) + 238 * l];
    }
    // soir : lumière basse, un peu plus chaude dans les clairs, un peu plus violette dans les ombres
    const lum = (c[0] * 0.3 + c[1] * 0.59 + c[2] * 0.11) / 255, k = 1 - 0.27 * s;
    return [c[0] * k + s * (-4 + 16 * lum), c[1] * k + s * (-2 + 4 * lum), c[2] * k + s * (10 - 10 * lum)];
  },
  snap(c) {
    let best = 0, bd = 1e9;
    for (let i = 0; i < PAL_RGB.length; i++) {
      const p = PAL_RGB[i], dr = p[0] - c[0], dg = p[1] - c[1], db = p[2] - c[2], d = dr * dr * 0.9 + dg * dg * 1.2 + db * db * 0.8 + 1.4 * ((dr - dg) * (dr - dg) + (dg - db) * (dg - db)); // la teinte compte : un vert reste vert
      if (d < bd) { bd = d; best = i; }
    }
    return best;
  },
  table(ph, lv) {
    const key = ph * 10 + lv; if (this.layers[key]) return this.layers[key];
    const s = lv <= 4 ? lv / 4 : 1.2, t = new Uint32Array(PAL_RGB.length);
    for (let i = 0; i < t.length; i++) { const q = PAL_RGB[this.snap(this.tint(ph, PAL_RGB[i], s))]; t[i] = (255 << 24) | (q[2] << 16) | (q[1] << 8) | q[0]; }
    return (this.layers[key] = t);
  },
  grade(ctx, ph, lv) {
    if (!this.c15) this.c15 = new Int8Array(32768).fill(-1);
    const W = G.W, H = G.H, base = this.table(ph, lv), rim = ph === 2 ? this.table(ph, Math.min(5, lv + 1)) : base;
    const img = ctx.getImageData(0, 0, W, H), d = new Uint32Array(img.data.buffer), c15 = this.c15;
    for (let y = 0; y < H; y++) {
      const dy = (y - H / 2) / (H / 2);
      for (let x = 0; x < W; x++) {
        const i = y * W + x, v = d[i], key = ((v & 255) >> 3) | (((v >> 8) & 255) >> 3) << 5 | (((v >> 16) & 255) >> 3) << 10;
        let idx = c15[key];
        if (idx < 0) idx = c15[key] = this.snap([(key & 31) << 3 | 4, (key >> 5 & 31) << 3 | 4, (key >> 10 & 31) << 3 | 4]);
        const dx = (x - W / 2) / (W / 2);
        d[i] = (dx * dx + dy * dy * 0.7 > 0.78) ? rim[idx] : base[idx];
      }
    }
    ctx.putImageData(img, 0, 0);
  },

  // ---------- changer de moment ----------
  setPhase(n, quiet) {
    const st = GAME.state; st.phase = n; Save.dirty();
    this.next = n; if (!quiet) AUD.phase(n);
    if (n !== 0) Care.stop();
    if (n === 1 || n === 2) UI.hintOnce(PHASES[n].key);
  },
  ready() { // le bouton du bas se met en valeur quand le moment a été vécu
    const st = GAME.state; if (!st) return false;
    if (st.phase === 0) return Care.allDone();
    if (st.phase === 1) return Mail.taken() && !Garden.ripe();
    return true;
  },
  advance() { // le bouton du bas : matin → journée → soir → fin de la journée
    const st = GAME.state, c = st.care; if (Care.fade || !c) return;
    const armed = UI.endArm > 0; UI.close(); // close() remet l'avertissement à zéro : on retient s'il avait été donné
    if (st.phase === 0) {
      const left = Care.total(c);
      if (left > 0 && !armed) { UI.endArm = 4; AUD.pop(); UI.toast('Passer à la journée ?', 'Il reste ' + left + (left > 1 ? ' bulles' : ' bulle') + '. Elles s’effaceront en fin de journée. Touchez encore pour passer quand même.', 'info'); return; }
      UI.endArm = 0; this.setPhase(1);
    } else if (st.phase === 1) { UI.endArm = 0; this.setPhase(2); Rare.eveningHook(); }
    else { UI.endArm = 0; Care.endDay(); }
  },

  // ---------- vie du soir ----------
  initFF() {
    const r = mulberry32(4242); this.ff = [];
    for (let i = 0; i < 16; i++) this.ff.push({ x: 30 + r() * 118, y: 96 + r() * 176, a: r() * 6.28, s: 3 + r() * 5, ph: r() * 6.28, bl: 1.1 + r() * 1.6, turn: r() * 2 });
  },
  update(dt) {
    this.t += dt;
    if (this.next != null) { this.k -= dt / 0.45; if (this.k <= 0) { this.k = 0; this.ph = this.next; this.next = null; } }
    else if (this.k < 1) this.k = Math.min(1, this.k + dt / 0.7);
    if (this.ph === 2 && this.k > 0) {
      if (!this.ff) this.initFF();
      for (const f of this.ff) {
        f.turn -= dt; if (f.turn <= 0) { f.turn = 0.8 + Math.random() * 1.6; f.da = (Math.random() - 0.5) * 3.2; }
        f.a += (f.da || 0) * dt; f.x += Math.cos(f.a) * f.s * dt; f.y += Math.sin(f.a) * f.s * 0.7 * dt;
        if (f.x < 28 || f.x > 150) { f.a = Math.PI - f.a; f.x = clamp(f.x, 28, 150); }
        if (f.y < 90 || f.y > 276) { f.a = -f.a; f.y = clamp(f.y, 90, 276); }
      }
    }
  },
  // dessiné par-dessus le refuge, sous l'interface
  draw(ctx) {
    const lv = Math.round(this.k * 4);
    if (this.ph !== 1 && lv > 0) this.grade(ctx, this.ph, lv);
    if (this.ph === 2 && this.k > 0.25) {
      const k = this.k;
      // fenêtre et porte de la cabane : une lumière chaude
      E(ctx, 33, 86, 3, 3, 27); P(ctx, 32, 85, 7); R(ctx, 44, 93, 6, 3, 27); R(ctx, 45, 92, 4, 1, 29);
      if (typeof Deco !== 'undefined') Deco.glows(ctx, k);
      for (const f of this.ff || []) {
        const on = Access.calm ? 0.4 : Math.sin(this.t * f.bl + f.ph);
        if (on < -0.1) continue;
        const x = Math.round(f.x), y = Math.round(f.y + Math.sin(this.t * 1.7 + f.ph) * 2);
        P(ctx, x, y, on > 0.55 ? 7 : 29);
        if (on > 0.35) { P(ctx, x - 1, y, 27); P(ctx, x + 1, y, 27); P(ctx, x, y - 1, 27); P(ctx, x, y + 1, 27); }
      }
    }
  }
};

/* ==== 13 · adoptions : les demandes des familles, confier un cochon, et la page « famille » de la fiche ====
   On ne vend rien : on confie. Les familles écrivent ensuite des cartes postales (carnet). Aucune demande n'a d'échéance. */
const Adopt = {
  open(pig) { // sans cochon : la liste des demandes ; avec un cochon (depuis sa fiche) : directement la confirmation
    UI.close(); UI.card = null; UI.adopt = pig ? { mode: 'confirm', pig: pig, req: null, from: 'card' } : { mode: 'list', req: null, pig: null }; AUD.pop(); UI.hintOnce('adoption');
  },
  candidates(st, req) { return st.pigs.filter(p => Life.canAdopt(st, p).ok && (!req || Life.reqMatch(p, req))); },

  act(h) {
    const a = UI.adopt, st = GAME.state; if (!a) return;
    switch (h.id) {
      case 'ad-close': UI.adopt = null; AUD.back(); break;
      case 'ad-back': if (a.mode === 'confirm' && a.from !== 'card') { a.mode = 'pick'; a.pig = null; } else if (a.mode === 'pick') { a.mode = 'list'; a.req = null; } else UI.adopt = null; AUD.back(); break;
      case 'ad-for': a.mode = 'pick'; a.req = h.data; AUD.pop(); break;
      case 'ad-free': a.mode = 'pick'; a.req = null; AUD.pop(); break;
      case 'ad-pig': a.mode = 'confirm'; a.pig = h.data; AUD.pop(); break;
      case 'ad-skip': Life.dismiss(st, h.data); UI.toast('Pas de souci', 'La famille ' + h.data.fam + ' cherchera ailleurs. D’autres demandes viendront.', 'adopt'); AUD.back(); break;
      case 'ad-go': {
        const pig = a.pig, req = a.req, fam = Life.famFor(st, pig, req);
        if (pig && Life.adopt(st, pig, req)) { UI.adopt = null; AUD.fanfare(); UI.toast(pig.name + ' part en famille', 'Chez la famille ' + fam + '. Vous recevrez de ses nouvelles dans quelques jours.', 'adopt'); }
        else { UI.adopt = null; }
        break;
      }
    }
  },

  draw(ctx) {
    const a = UI.adopt, st = GAME.state; if (!a) return;
    UI.reg('ad-close', 0, 0, G.W, G.H, 'bg'); dimLayer(ctx);
    const px = 8, pw = 160;
    if (a.mode === 'list') {
      const reqs = st.reqs, blocks = reqs.map(r => {
        const lines = FONT.wrap('La famille ' + r.fam + ' cherche ' + Life.reqDesc(r) + '.', 136), match = this.candidates(st, r);
        let ml = match.length ? 'Convient : ' + match.slice(0, 3).map(p => p.name).join(', ') : 'Personne ne convient.';
        while (FONT.width(ml) > 136 && ml.length > 8) ml = ml.slice(0, -2).replace(/[ ,]+$/, '') + '…';
        return { r: r, lines: lines, match: match, ml: ml, h: lines.length * 11 + 3 + 11 + 4 + 16 + 8 };
      });
      const free = this.candidates(st, null);
      const h = 8 + 12 + 6 + (blocks.length ? blocks.reduce((s, b) => s + b.h, 0) : 36) + 4 + 11 + 3 + 18 + 8 + 18 + 9, py = clamp(Math.round((BAR_Y - h) / 2), 4, 60);
      UI.reg('ad-panel', px, py, pw, h); panel(ctx, px, py, pw, h);
      ctext(ctx, 'Adoptions', px + (pw >> 1), py + 8, 13); R(ctx, px + 22, py + 19, pw - 44, 1, 17);
      let y = py + 26;
      if (!blocks.length) { FONT.wrap('Pas de demande pour le moment. Les familles écrivent de temps en temps.', 136).forEach(l => { ctext(ctx, l, px + (pw >> 1), y, 14); y += 11; }); y += 6; }
      blocks.forEach(b => {
        R(ctx, px + 8, y, pw - 16, b.h - 4, 13); R(ctx, px + 9, y + 1, pw - 18, b.h - 6, 24);

/* ---- 13_backup.js ---- */
/* ==== 13 · copies de secours : fichier, code à copier, restauration, retour en arrière ; installation et stockage durable ====
   Pourquoi : sur un site, la partie vit dans le navigateur de l'appareil. Une copie la met à l'abri (navigateur vidé, nouveau téléphone).
   - Fichier « clos-des-wheeks-jourN-date.json » : tout (partie, réglages de confort, photos).
   - Code « CLOS1.… » : partie et réglages, sans les photos ; sans guillemets, donc il survit aux messageries qui « embellissent » le texte.
   - Restaurer demande toujours confirmation, montre les deux parties côte à côte, et garde l'ancienne partie
     (clé « clos-wheeks-save-avant ») : « Revenir en arrière » la rend, et rend la nouvelle si on change encore d'avis.
   - Rien ne punit : un seul petit conseil, une fois, sans jamais bloquer. */
const Backup = {
  KS: 'clos-wheeks-save-avant', KM: 'clos-wheeks-copie', TAG: 'CLOS1.',
  meta: null, msg: '', msgT: 0, msgBad: false, conf: null, undo: null, busy: false, installEvt: null, installed: false, chk: 0,

  // ---------- petites notes (dernière copie, conseils déjà donnés) ----------
  loadMeta() {
    if (this.meta) return this.meta;
    let o = null; try { o = JSON.parse(Save.read(this.KM) || 'null'); } catch (e) { o = null; }
    o = o && typeof o === 'object' ? o : {};
    return (this.meta = { last: Math.max(0, +o.last || 0), tip: o.tip === 1 ? 1 : 0, tipi: o.tipi === 1 ? 1 : 0, pp: o.pp === 1 ? 1 : 0 });
  },
  saveMeta() { try { Save.write(this.KM, JSON.stringify(this.loadMeta())); } catch (e) { /* tant pis */ } },
  say(t, bad) { this.msg = t; this.msgBad = !!bad; this.msgT = 6; },

  // ---------- codage du texte (UTF-8 → base64 « url », sans « = » ni « + ») ----------
  toB64(str) {
    const bytes = new TextEncoder().encode(str); let s = '';
    for (let i = 0; i < bytes.length; i += 8192) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  },
  fromB64(b) {
    let s = b.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '=';
    const bin = atob(s), bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
  },

  // ---------- fabriquer une copie ----------
  pack(withAlbum) {
    try { Save.commit(); } catch (e) { /* on prend ce qu'il y a */ }
    let partie = null; try { partie = JSON.parse(Save.read(Save.K1)); } catch (e) { partie = null; }
    if (!partie) partie = JSON.parse(JSON.stringify(GAME.state));
    const o = { jeu: 'clos-wheeks', fmt: 1, date: Date.now(), partie: partie, confort: { calm: Access.calm, hi: Access.hi, slow: Access.slow, vol: Access.vol, amb: Access.amb } };
    if (withAlbum) o.album = Photo.snap();
    return o;
  },
  code() { return this.TAG + this.toB64(JSON.stringify(this.pack(false))) + '.'; },
  fileName(o) {
    const d = new Date(o.date), p = n => ('0' + n).slice(-2);
    return 'clos-des-wheeks-jour' + o.partie.day + '-' + d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + '.json';
  },
  isIOS() { const u = navigator.userAgent || ''; return /iPad|iPhone|iPod/.test(u) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); },
  standalone() { try { return !!(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; } catch (e) { return false; } },

  async exportFile() {
    if (this.busy) return; this.busy = true;
    try {
      const o = this.pack(true), text = JSON.stringify(o), name = this.fileName(o);
      // page publiée dans Claude : les téléchargements directs sont bloqués, on passe par la fonction « downloads » (le lecteur confirme)
      let dl = null;
      try { if (window.claude && typeof window.claude.use === 'function') dl = await Promise.race([window.claude.use('downloads'), new Promise(r => setTimeout(() => r(null), 3000))]); } catch (e) { dl = null; }
      if (dl && typeof dl.save === 'function') {
        try { await dl.save({ filename: name, data: text }); this.done('Fichier enregistré.'); }
        catch (e) { if (e && e.code === 'declined') { this.busy = false; return; } this.say('Fichier impossible ici. Essayez le code.', true); AUD.deny(); }
        this.busy = false; return;
      }
      const file = typeof File === 'function' ? new File([text], name, { type: 'application/json' }) : null;
      if (file && this.isIOS() && navigator.canShare && navigator.canShare({ files: [file] })) { // sur iPhone, la feuille de partage est le chemin fiable vers « Fichiers »
        try { await navigator.share({ files: [file], title: 'Sauvegarde du Clos des Wheeks' }); this.done('Copie enregistrée.'); this.busy = false; return; }
        catch (e) { if (e && e.name === 'AbortError') { this.busy = false; return; } /* sinon : téléchargement */ }
      }
      const url = URL.createObjectURL(new Blob([text], { type: 'application/json' })), a = document.createElement('a');
      a.href = url; a.download = name; a.style.display = 'none'; document.body.appendChild(a); a.click();
      setTimeout(() => { try { document.body.removeChild(a); URL.revokeObjectURL(url); } catch (e) { /* rien */ } }, 4000);
      this.done('Fichier créé : voir vos téléchargements.');
    } catch (e) { this.say('Fichier impossible ici. Essayez le code.', true); AUD.deny(); }
    this.busy = false;
  },
  done(t) { const m = this.loadMeta(); m.last = Date.now(); this.saveMeta(); this.say(t, false); AUD.chime(); },

  async copyCode() {
    if (this.busy) return; this.busy = true;
    let ok = false; const text = this.code();
    try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); ok = true; } } catch (e) { ok = false; }
    if (!ok) { // vieux navigateurs, ou page encadrée qui refuse le presse-papiers moderne
      try { const t = document.createElement('textarea'); t.value = text; t.setAttribute('readonly', ''); t.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0'; document.body.appendChild(t); t.select(); t.setSelectionRange(0, text.length); ok = document.execCommand('copy'); document.body.removeChild(t); } catch (e) { ok = false; }
    }
    if (ok) this.done('Code copié : à coller dans une note.');
    else { this.say('Copie impossible ici. Essayez le fichier.', true); AUD.deny(); }
    this.busy = false;
  },
  async pasteCode() {
    if (this.busy) return; this.busy = true;
    let text = null;
    try { if (navigator.clipboard && navigator.clipboard.readText) text = await navigator.clipboard.readText(); } catch (e) { text = null; }
    if (text == null) { try { text = window.prompt('Collez ici le code de sauvegarde :', ''); } catch (e) { text = null; } }
    this.busy = false;
    if (text == null) { this.say('Rien n’a été collé. Essayez le fichier.', true); AUD.deny(); return; }
    this.stage(text, 'code');
  },
  openFile() {
    if (this.busy) return;
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json,text/plain,.txt'; inp.style.display = 'none';
    document.body.appendChild(inp);
    const clean = () => { try { document.body.removeChild(inp); } catch (e) { /* rien */ } };
    inp.addEventListener('change', async () => {
      const f = inp.files && inp.files[0]; clean(); if (!f) return;
      if (f.size > 8 * 1024 * 1024) { this.say('Ce fichier est trop gros pour être une copie.', true); AUD.deny(); return; }
      let text = ''; try { text = await f.text(); } catch (e) { text = ''; }
      this.stage(text, 'fichier');
    });
    inp.addEventListener('cancel', clean);
    inp.click();
  },

  // ---------- lire et vérifier une copie (jamais de plantage : une copie abîmée est refusée avec un mot doux) ----------
  parse(text) {
    let s = String(text == null ? '' : text); if (!s.trim()) return { err: 'vide' };
    let o = null;
    try {
      const flat = s.replace(/\s+/g, ''), i = flat.indexOf(this.TAG);
      if (i >= 0) { const m = /^[A-Za-z0-9_-]+/.exec(flat.slice(i + this.TAG.length)); o = JSON.parse(this.fromB64(m ? m[0] : '')); }
      else o = JSON.parse(s.replace(/^﻿/, '').trim());
    } catch (e) { return { err: 'illisible' }; }
    if (!o || typeof o !== 'object' || o.jeu !== 'clos-wheeks' || !o.partie || typeof o.partie !== 'object') return { err: 'illisible' };
    if ((o.partie.v | 0) > SAVE_VERSION) return { err: 'recent' };
    let st = null; try { st = sanitizeState(o.partie); } catch (e) { st = null; }
    if (!st) return { err: 'sansCochon' };
    let album = null;
    if (Array.isArray(o.album)) { try { album = o.album.map(x => Photo.clean(x)).filter(Boolean).slice(0, PHOTO_MAX + SOUV_MAX); } catch (e) { album = []; } }
    return { ok: true, st: st, album: album, confort: o.confort && typeof o.confort === 'object' ? o.confort : null, date: +o.date || 0 };
  },
  ERR: {
    vide: 'Rien à lire : c’est vide.',
    illisible: 'Ce n’est pas une copie du Clos des Wheeks.',
    recent: 'Copie trop récente : rechargez la page.',
    sansCochon: 'Cette copie ne contient aucun cochon.'
  },
  stage(text, kind) { // lit, puis demande confirmation
    const pk = this.parse(text);
    if (!pk.ok) { this.say(this.ERR[pk.err] || this.ERR.illisible, true); AUD.deny(); return; }
    this.conf = { pk: pk, kind: kind, undo: false }; AUD.pop();
  },
  stageUndo() {
    const u = this.undo; if (!u) return;
    this.conf = { pk: { ok: true, st: u.st, album: u.album, confort: null, date: u.at }, kind: 'avant', undo: true }; AUD.pop();
  },

  // ---------- la partie d'avant : gardée avant chaque restauration et chaque nouvelle partie ----------
  keep() {
    try {
      const st = GAME.state; if (!st) return;
      Save.commit();
      const raw = Save.read(Save.K1) || JSON.stringify(st);
      Save.write(this.KS, JSON.stringify({ at: Date.now(), partie: raw, album: Photo.snap() }));
    } catch (e) { /* la copie de sécurité est un plus, jamais un frein */ }
  },
  readUndo() {
    this.undo = null;
    let o = null; try { o = JSON.parse(Save.read(this.KS) || 'null'); } catch (e) { o = null; }
    if (!o || typeof o.partie !== 'string') return;
    const st = Save.parse(o.partie); if (!st) return;
    let album = null; try { album = (Array.isArray(o.album) ? o.album : []).map(x => Photo.clean(x)).filter(Boolean).slice(0, PHOTO_MAX + SOUV_MAX); } catch (e) { album = null; }
    this.undo = { at: +o.at || 0, st: st, album: album };
  },
  apply() {
    const c = this.conf; if (!c) return; const pk = c.pk; this.conf = null;
    this.keep();
    const st = pk.st;
    Save.adopt(st); GAME.rebuild(st);
    if (pk.album) { Photo.items = pk.album; Photo.persist(); }
